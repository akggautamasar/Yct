<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>YCT Downloader</title>
<style>
/* --- THEME VARIABLES --- */
:root {
  /* DARK THEME (Default) */
  --bg: #0f172a;
  --surface: rgba(30, 41, 59, 0.85);
  --surface-solid: #1e293b;
  --card: #1e293b;
  --card-hover: #334155;
  --border: #334155;
  --border2: #475569;
  
  --txt: #f8fafc;
  --txt2: #cbd5e1;
  --txt3: #94a3b8;
  
  --acc: #6366f1;
  --acc-hover: #818cf8;
  --acc-bg: rgba(99, 102, 241, 0.15);
  
  --ok: #10b981;
  --ok-bg: rgba(16, 185, 129, 0.15);
  --warn: #f59e0b;
  --warn-bg: rgba(245, 158, 11, 0.15);
  --err: #ef4444;
  --err-bg: rgba(239, 68, 68, 0.15);
  --dl: #0ea5e9;
  --dl-bg: rgba(14, 165, 233, 0.15);
  
  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;
  
  --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 10px 20px -5px rgba(0, 0, 0, 0.4);
  --shadow-book: 0 8px 16px rgba(0, 0, 0, 0.4);
}

[data-theme="light"] {
  /* LIGHT THEME */
  --bg: #f8fafc;
  --surface: rgba(255, 255, 255, 0.85);
  --surface-solid: #ffffff;
  --card: #ffffff;
  --card-hover: #f1f5f9;
  --border: #e2e8f0;
  --border2: #cbd5e1;
  
  --txt: #0f172a;
  --txt2: #334155;
  --txt3: #64748b;
  
  --acc: #4f46e5;
  --acc-hover: #4338ca;
  --acc-bg: rgba(79, 70, 229, 0.1);
  
  --ok: #059669;
  --ok-bg: rgba(16, 185, 129, 0.15);
  --warn: #d97706;
  --warn-bg: rgba(245, 158, 11, 0.15);
  --err: #dc2626;
  --err-bg: rgba(239, 68, 68, 0.15);
  --dl: #0284c7;
  --dl-bg: rgba(14, 165, 233, 0.15);

  --shadow-sm: 0 2px 4px -1px rgba(0, 0, 0, 0.05);
  --shadow-md: 0 10px 20px -5px rgba(0, 0, 0, 0.1);
  --shadow-book: 0 8px 16px rgba(0, 0, 0, 0.15);
}

/* --- GLOBAL STYLES --- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--txt);
  font: 14.5px/1.6 'Inter', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.3s ease, color 0.3s ease;
}

.app { display: grid; grid-template-rows: 64px 1fr; height: 100dvh; overflow: hidden; }

/* --- HEADER --- */
header {
  display: flex; align-items: center; gap: 14px; padding: 0 20px;
  background: var(--surface);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 20;
  transition: background-color 0.3s ease, border-color 0.3s ease;
}
.logo { font-size: 26px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
header h1 { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; flex: 1; }

.theme-toggle {
  background: transparent; border: 1px solid var(--border2); color: var(--txt);
  width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s;
}
.theme-toggle:hover { background: var(--card-hover); transform: scale(1.05); }
.theme-toggle svg { width: 18px; height: 18px; fill: currentColor; }
[data-theme="light"] .icon-moon { display: block; }
[data-theme="light"] .icon-sun { display: none; }
:root:not([data-theme="light"]) .icon-moon { display: none; }
:root:not([data-theme="light"]) .icon-sun { display: block; }

.badge {
  font-size: 12px; padding: 6px 12px; border-radius: 30px; 
  font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em;
}
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }

/* --- LAYOUT --- */
.body { display: grid; grid-template-columns: 420px 1fr; overflow: hidden; min-height: 0; }

.sidebar {
  background: var(--surface-solid); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden; min-height: 0;
  transition: background-color 0.3s ease, border-color 0.3s ease;
}
.main { overflow-y: auto; padding: 24px; background: var(--bg); min-height: 0; transition: background-color 0.3s ease; }

/* --- SIDEBAR COMPONENTS --- */
.cat-bar {
  padding: 16px; border-bottom: 1px solid var(--border);
  display: flex; gap: 10px; align-items: center; flex-shrink: 0;
}
.cat-bar select { flex: 1; font-weight: 600; }
.cat-bar .btn { flex-shrink: 0; padding: 11px 18px; }

.books-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 8px; flex-shrink: 0;
}
.books-hd span { font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--txt3); }
.books-hd .count { font-size: 12px; color: var(--acc); font-weight: 700; background: var(--acc-bg); padding: 2px 8px; border-radius: 12px;}

/* --- FORM ELEMENTS --- */
select, input[type=number], input[type=text] {
  width: 100%; background: var(--bg); border: 1px solid var(--border2);
  border-radius: var(--r-sm); color: var(--txt); padding: 12px 16px;
  font: inherit; outline: none; transition: all 0.2s;
}
select:focus, input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-bg); }
select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 14px center; background-size: 16px; padding-right: 40px; }

/* --- BUTTONS --- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: none; border-radius: var(--r-sm); font: inherit; font-weight: 700;
  font-size: 14px; padding: 12px 20px; cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); text-decoration: none;
}
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-pri { background: var(--acc); color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
.btn-pri:hover:not(:disabled) { background: var(--acc-hover); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(99,102,241,0.4); }
.btn-ghost { background: var(--card); color: var(--txt); border: 1px solid var(--border2); box-shadow: var(--shadow-sm); }
.btn-ghost:hover:not(:disabled) { background: var(--card-hover); border-color: var(--txt3); }
.btn-ok { background: var(--ok-bg); color: var(--ok); border: 1px solid rgba(16,185,129,0.3); }
.btn-ok:hover:not(:disabled) { background: rgba(16,185,129,0.25); }
.btn-dl { background: var(--dl-bg); color: var(--dl); border: 1px solid rgba(14,165,233,0.3); }
.btn-dl:hover:not(:disabled) { background: rgba(14,165,233,0.25); }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }

/* --- BEAUTIFUL EDGE-TO-EDGE GRID GALLERY --- */
.book-list { 
  flex: 1; 
  overflow-y: auto; 
  padding: 8px 16px 20px; 
  min-height: 0; 
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 16px;
  align-content: start;
}

.book-list > .muted {
  grid-column: 1 / -1;
}

.book-item {
  display: flex; flex-direction: column; align-items: stretch; 
  padding: 0; /* REMOVED PADDING - Image goes edge to edge */
  border: 1px solid var(--border); border-radius: var(--r-md);
  cursor: pointer; background: var(--card);
  transition: all 0.2s ease; box-shadow: var(--shadow-sm);
  overflow: hidden; /* Clips the image to the card's rounded corners */
}
.book-item:hover { border-color: var(--border2); transform: translateY(-4px); box-shadow: var(--shadow-md); }
.book-item.sel { border-color: var(--acc); box-shadow: 0 0 0 2px var(--acc); transform: translateY(-2px); }

/* HUGE GRID COVERS */
.book-cover-img {
  width: 100%; 
  height: auto;
  aspect-ratio: 3 / 4; 
  object-fit: cover;
  background: var(--surface); 
  border-bottom: 1px solid var(--border); 
}
.book-icon-fallback {
  width: 100%; height: auto; aspect-ratio: 3 / 4; 
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); font-size: 40px;
  border-bottom: 1px solid var(--border); 
}

/* Moved padding into the info block instead */
.book-item .info { 
  padding: 12px; 
  display: flex; flex-direction: column; align-items: center; text-align: center; 
  flex: 1;
}
.book-item .name {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; font-size: 13.5px; font-weight: 700; line-height: 1.4;
  margin-bottom: 8px; color: var(--txt);
}
.book-item .sub { 
  font-size: 11.5px; color: var(--txt3); font-weight: 700; 
  display: inline-flex; background: var(--bg); padding: 4px 10px; 
  border-radius: 6px; border: 1px solid var(--border);
  margin-top: auto;
}

/* --- OPTIONS CARD --- */
.opt-card {
  display: none;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow-md);
}
.opt-card.show { display: block; animation: slideUp 0.4s ease; }
.opt-card h2 { font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--txt3); margin-bottom: 20px; }
.opt-row { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.opt-row label { font-size: 14px; font-weight: 600; color: var(--txt2); display: flex; align-items: center; gap: 10px; }
.opt-row input[type=number] { width: 100px; font-weight: 700; text-align: center; }
.chk-label { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--txt2); cursor: pointer; user-select: none; }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--acc); cursor: pointer; border-radius: 4px; }

/* --- SELECTED BOOK HERO --- */
.sel-info {
  display: none; align-items: center; gap: 24px;
  background: linear-gradient(135deg, var(--card), var(--bg));
  border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow-md);
}
.sel-info.show { display: flex; animation: slideUp 0.4s ease; }

.sel-info-cover, .sel-info-fallback {
  width: 100px; height: 144px; object-fit: cover; border-radius: 8px;
  border: 1px solid rgba(0,0,0,0.1); flex-shrink: 0;
  box-shadow: var(--shadow-book);
}
.sel-info-fallback { display: flex; align-items: center; justify-content: center; background: var(--surface); font-size: 48px; }

.sel-details { flex: 1; min-width: 0; }
.sel-details strong { color: var(--txt); display: block; margin-bottom: 12px; font-size: 18px; font-weight: 800; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sel-details span { font-size: 13.5px; color: var(--acc); font-weight: 700; background: var(--acc-bg); padding: 6px 12px; border-radius: 8px; display: inline-block; border: 1px solid rgba(99,102,241,0.2); }

/* --- JOBS SECTION --- */
.jobs-section { display: none; }
.jobs-section.show { display: block; animation: fadeIn 0.5s ease; }
.jobs-section h2 { font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--txt3); margin-bottom: 16px; }
.job-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm); transition: transform 0.2s; }
.job-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.job-card .title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
.job-card .book-title { font-size: 16px; font-weight: 700; flex: 1; color: var(--txt); line-height: 1.35; }
.job-card .status-pill { flex-shrink: 0; font-size: 12px; font-weight: 800; padding: 6px 14px; border-radius: 30px; text-transform: uppercase; letter-spacing: 0.05em; }

.pill-done { background: var(--ok-bg); color: var(--ok); border: 1px solid rgba(16,185,129,0.3); }
.pill-err { background: var(--err-bg); color: var(--err); border: 1px solid rgba(239,68,68,0.3); }
.pill-run { background: var(--acc-bg); color: var(--acc); border: 1px solid rgba(99,102,241,0.3); }
.pill-queue { background: var(--bg); color: var(--txt3); border: 1px solid var(--border); }
.pill-wait { background: var(--dl-bg); color: var(--dl); border: 1px solid rgba(14,165,233,0.3); animation: pulse 2s infinite; }

@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(14,165,233,0.4); } 70% { box-shadow: 0 0 0 8px rgba(14,165,233,0); } 100% { box-shadow: 0 0 0 0 rgba(14,165,233,0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; animation: spin 1s linear infinite; }

.job-card .prog-row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
.bar { flex: 1; height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.bar i { display: block; height: 100%; background: var(--acc); border-radius: 99px; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
.bar.done i { background: var(--ok); }
.bar.err i { background: var(--err); }
.prog-txt { font-size: 14px; font-weight: 700; color: var(--txt2); white-space: nowrap; min-width: 65px; text-align: right; }
.job-card .meta { font-size: 13.5px; color: var(--txt3); margin-bottom: 10px; display: flex; gap: 12px; font-weight: 500;}
.job-card .err-msg { font-size: 13.5px; font-weight: 600; color: var(--err); margin-bottom: 12px; background: var(--err-bg); padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(239,68,68,0.2); }
.parts-summary { font-size: 13.5px; color: var(--acc); margin-bottom: 12px; font-weight: 600; }

.gate-box { background: var(--bg); border: 1px dashed var(--dl); border-radius: var(--r-md); padding: 20px; margin-top: 16px; }
.gate-label { font-size: 15px; font-weight: 700; color: var(--dl); margin-bottom: 6px; }
.gate-hint { font-size: 14px; font-weight: 500; color: var(--txt2); margin-bottom: 16px; line-height: 1.5; }
.gate-btns { display: flex; gap: 12px; flex-wrap: wrap; }
.gate-waiting { font-size: 14px; font-weight: 600; color: var(--txt2); margin-top: 16px; padding: 14px 20px; background: var(--bg); border-radius: var(--r-md); border: 1px dashed var(--border2); display: inline-flex; align-items: center; gap: 10px; }

.muted { color: var(--txt3); font-size: 14px; font-weight: 500; text-align: center; padding: 40px 20px; }

/* Main empty placeholder */
.main-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; color: var(--txt3); padding: 80px 24px; height: 100%;
  background: var(--card); border: 2px dashed var(--border); border-radius: var(--r-lg);
}
.main-empty .icon { font-size: 56px; margin-bottom: 20px; opacity: 0.8; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2)); }
.main-empty h3 { font-size: 18px; color: var(--txt); font-weight: 800; margin-bottom: 10px; }
.main-empty p { font-size: 14.5px; max-width: 360px; line-height: 1.6; }

/* Custom Scrollbars */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--txt3); }

/* --- MOBILE LAYOUT --- */
@media (max-width: 768px) {
  header { padding: 0 16px; }
  .body { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .sidebar { border-right: none; }
  .main { display: none; }
  
  /* Force exactly 2 columns for the massive grid on mobile */
  .book-list {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 8px 12px 24px;
  }

  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--card); border-top: 1px solid var(--border);
    border-radius: 24px 24px 0 0; max-height: 90dvh; overflow-y: auto;
    padding: 16px 20px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    box-shadow: 0 -20px 40px rgba(0,0,0,0.3);
  }
  .sheet.show { transform: translateY(0); }
  .sheet-handle {
    width: 48px; height: 5px; background: var(--border2); border-radius: 99px;
    margin: 0 auto 16px;
  }
  .sheet-close {
    position: absolute; top: 16px; right: 16px;
    background: var(--bg); border: 1px solid var(--border2); color: var(--txt);
    width: 36px; height: 36px; border-radius: 50%; font-size: 20px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: var(--shadow-sm);
  }

  .sheet .sel-info, .sheet .opt-card, .sheet .jobs-section { display: none; }
  .sheet .sel-info.show, .sheet .opt-card.show, .sheet .jobs-section.show { display: flex; }
  .sheet .opt-card.show, .sheet .jobs-section.show { display: block; }
  
  .sel-info { flex-direction: column; text-align: center; align-items: center; }
  .sel-info-cover { width: 120px; height: 172px; } /* Even bigger in sheet */

  .btn-row .btn { flex: 1; min-width: 0; }
}
@media (min-width: 769px) {
  .sheet, .sheet-backdrop { display: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="logo">&#128218;</span>
    <h1>YCT Downloader</h1>
    
    <!-- THEME TOGGLE BUTTON -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">
      <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM3.515 4.929l1.414-1.414L7.05 5.636 5.636 7.05 3.515 4.93zM16.95 18.364l1.414-1.414 2.121 2.121-1.414 1.414-2.121-2.121zm2.121-14.85l1.414 1.415-2.121 2.121-1.414-1.414 2.121-2.121zM5.636 16.95l1.414 1.414-2.121 2.121-1.414-1.414 2.121-2.121zM23 11v2h-3v-2h3zM4 11v2H1v-2h3z"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>
    
    <span class="badge warn" id="health">checking&#8230;</span>
  </header>
  <div class="body">
    <aside class="sidebar">
      <div class="cat-bar">
        <select id="cat"><option>Loading&#8230;</option></select>
        <button class="btn btn-ghost" id="loadBooks">Load</button>
      </div>
      <div class="books-hd">
        <span>Available Books</span>
        <span class="count" id="bookCount"></span>
      </div>
      <div class="book-list" id="books">
        <div class="muted">Pick a category, then tap Load.</div>
      </div>
    </aside>
    <main class="main" id="mainPane">
      <div id="mainContent">
        <div class="main-empty" id="mainEmpty">
          <div class="icon">&#128218;</div>
          <h3>Select a book to get started</h3>
          <p>Pick a category on the left, choose a book, then queue a download to Telegram or your browser.</p>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Mobile bottom sheet -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="sheetClose" aria-label="Close">&times;</button>
  <div id="sheetContent"></div>
</div>

<!-- Reusable content templates -->
<template id="tplDetails">
  <div class="sel-info" id="selInfo">
    <div id="selCoverContainer"></div>
    <div class="sel-details">
      <strong id="selTitle">&#8212;</strong>
      <span id="selMeta"></span>
    </div>
  </div>
  <div class="opt-card" id="optCard">
    <h2>Download Options</h2>
    <div class="opt-row">
      <label>Start <input type="number" id="start" value="1" min="1"></label>
      <label>End <input type="number" id="end" placeholder="all"></label>
      <label class="chk-label" style="margin-left:auto;"><input type="checkbox" id="ocr"> Searchable PDF (OCR)</label>
    </div>
    <div class="btn-row">
      <button class="btn btn-pri" id="goTelegram">&#9992; Send to Telegram</button>
      <button class="btn btn-dl" id="goBrowser">&#8595; Download to Device</button>
      <button class="btn btn-ok" id="goBoth">&#9889; Do Both</button>
    </div>
  </div>
  <div class="jobs-section" id="jobsSection">
    <h2>Active &amp; Recent Jobs</h2>
    <div id="jobs"></div>
  </div>
</template>

<script>
const $ = s => document.querySelector(s);
let selected = null;
const isMobile = () => window.matchMedia('(max-width: 768px)').matches;

/* --- THEME TOGGLE LOGIC --- */
const themeToggle = document.getElementById('themeToggle');
const htmlEl = document.documentElement;

const savedTheme = localStorage.getItem('theme');
if (savedTheme) {
  htmlEl.setAttribute('data-theme', savedTheme);
} else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
  htmlEl.setAttribute('data-theme', 'light');
}

themeToggle.addEventListener('click', () => {
  if (htmlEl.getAttribute('data-theme') === 'light') {
    htmlEl.removeAttribute('data-theme');
    localStorage.setItem('theme', 'dark');
  } else {
    htmlEl.setAttribute('data-theme', 'light');
    localStorage.setItem('theme', 'light');
  }
});


// Render template into desktop main pane on load
function renderMain() {
  const tpl = document.getElementById('tplDetails').content.cloneNode(true);
  document.getElementById('mainContent').appendChild(tpl);
  bindActions();
}

function bindActions() {
  $('#goTelegram').onclick = ()=>go({telegram:true,browser:false});
  $('#goBrowser').onclick  = ()=>go({telegram:false,browser:true});
  $('#goBoth').onclick     = ()=>go({telegram:true,browser:true});
}

// On mobile, content lives inside the sheet.
function moveContentToSheet() {
  const sheet = document.getElementById('sheetContent');
  const main = document.getElementById('mainContent');
  while (main.firstChild) sheet.appendChild(main.firstChild);
}
function moveContentToMain() {
  const sheet = document.getElementById('sheetContent');
  const main = document.getElementById('mainContent');
  while (sheet.firstChild) main.appendChild(sheet.firstChild);
}

function openSheet() {
  if (!isMobile()) return;
  moveContentToSheet();
  document.getElementById('sheet').classList.add('show');
  document.getElementById('sheetBackdrop').classList.add('show');
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('sheetBackdrop').classList.remove('show');
  setTimeout(moveContentToMain, 300);
}
document.getElementById('sheetClose').onclick = closeSheet;
document.getElementById('sheetBackdrop').onclick = closeSheet;

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.status);
  return r.json();
}

function fmtStatus(s) {
  if (!s) return '';
  return s.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
}
function pillClass(status) {
  if (status === 'done') return 'pill-done';
  if (status === 'error') return 'pill-err';
  if (status === 'queued') return 'pill-queue';
  if ((status||'').startsWith('waiting_user')) return 'pill-wait';
  return 'pill-run';
}

async function health() {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 8000);
    const r = await fetch('/healthz', {signal: ctrl.signal});
    clearTimeout(timer);
    const h = await r.json();
    const el = $('#health');
    if (h.ok) { el.textContent='System Ready'; el.className='badge ok'; }
    else { el.textContent='Env Missing'; el.className='badge warn'; }
  } catch {
    $('#health').textContent='Connecting...';
    setTimeout(health, 4000);
  }
}

async function loadCats() {
  const sel = $('#cat');
  sel.innerHTML = '<option>Loading...</option>';
  for (let attempt = 1; attempt <= 5; attempt++) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), 35000);
      const r = await fetch('/api/categories', {signal: ctrl.signal});
      clearTimeout(timer);
      if (!r.ok) {
        const err = await r.json().catch(()=>({detail:'server error'}));
        throw new Error(err.detail || r.status);
      }
      const cats = await r.json();
      if (!cats.length) { sel.innerHTML='<option>No categories found</option>'; return; }
      sel.innerHTML = cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
      return;
    } catch(e) {
      if (attempt < 5) {
        sel.innerHTML=`<option>Retrying (${attempt}/5)...</option>`;
        await new Promise(r=>setTimeout(r, 3000));
      } else {
        sel.innerHTML=`<option>Failed: ${e.message}</option>`;
      }
    }
  }
}

async function loadBooks() {
  const cat = $('#cat').value;
  const btn = $('#loadBooks');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin">&#8987;</span>';
  $('#books').innerHTML = '<div class="muted"><span class="spin">&#8987;</span> Fetching beautifully...</div>';
  $('#bookCount').textContent = '';
  try {
    const books = await api('/api/books?cat='+cat);
    if (!books.length) { $('#books').innerHTML='<div class="muted">No books found.</div>'; return; }
    $('#bookCount').textContent = books.length + ' books';
    $('#books').innerHTML = books.map(b => {
      const coverUrl = b.cover || '';
      const coverHtml = coverUrl
        ? `<img src="${coverUrl}" class="book-cover-img" alt="cover" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=\\'book-icon-fallback\\'>📚</div>'"/>`
        : `<div class="book-icon-fallback">📚</div>`;
      return `
      <div class="book-item" data-id="${b.book_id}" data-name="${encodeURIComponent(b.name)}" data-cover="${encodeURIComponent(coverUrl)}">
        ${coverHtml}
        <div class="info">
          <div class="name">${b.name}</div>
          <div class="sub">ID: ${b.book_id}</div>
        </div>
      </div>`;
    }).join('');
    document.querySelectorAll('.book-item').forEach(el=>el.onclick=()=>selectBook(el));
  } catch(e) {
    $('#books').innerHTML=`<div class="muted">Error: ${e.message}</div>`;
  } finally {
    btn.disabled=false; btn.textContent='Load';
  }
}

async function selectBook(el) {
  document.querySelectorAll('.book-item').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');

  const coverUrl = decodeURIComponent(el.dataset.cover);
  selected = {
    book_id: +el.dataset.id,
    title: decodeURIComponent(el.dataset.name),
    cover: coverUrl,
    total: null
  };

  const mainEmpty = document.getElementById('mainEmpty');
  if (mainEmpty) mainEmpty.remove();

  $('#selInfo').classList.add('show');
  $('#selTitle').textContent = selected.title;
  $('#optCard').classList.add('show');

  const selCoverHtml = coverUrl
    ? `<img src="${coverUrl}" class="sel-info-cover" alt="cover" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=\\'sel-info-fallback\\'>📚</div>'"/>`
    : `<div class="sel-info-fallback">📚</div>`;
  $('#selCoverContainer').innerHTML = selCoverHtml;
  $('#selMeta').innerHTML = `<span class="spin" style="font-size:12px; margin-right:6px;">&#8987;</span> Checking pages&hellip;`;

  openSheet();

  try {
    const p = await api('/api/pages?book_id='+selected.book_id);
    selected.total = p.total_pages;
    $('#selMeta').innerHTML = `&#128196; ${p.total_pages||'Unknown'} pages &nbsp;&middot;&nbsp; ID ${selected.book_id}`;
    if (p.total_pages) $('#end').placeholder=`all (${p.total_pages})`;
  } catch {
    $('#selMeta').innerHTML = `ID ${selected.book_id}`;
  }
}

async function go({telegram, browser}) {
  if (!selected) { alert('Select a book first.'); return; }
  const body = {
    book_id:selected.book_id, title:selected.title, cover:selected.cover,
    start:+$('#start').value||1,
    end:$('#end').value?(+$('#end').value):null,
    do_ocr:$('#ocr').checked,
    total_pages:selected.total||null,
    browser_download:browser,
    telegram:telegram,
  };
  try {
    await api('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    pollJobs();
  } catch(e) { alert('Failed to queue: '+e.message); }
}

function jobCard(jb) {
  const pct = jb.total ? Math.round(jb.done*100/jb.total) : 0;
  const isDone = jb.status==='done';
  const isErr  = jb.status==='error';
  const isWait = (jb.status||'').startsWith('waiting_user');
  const barCls = isDone?'done':isErr?'err':'';
  const pillCls= pillClass(jb.status);
  const ts = new Date(jb.ts*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const errMsg = isErr?`<div class="err-msg">&#9888; Failed: ${jb.error||'Unknown error'}</div>`:'';
  const totalParts = jb.total_parts||0;
  const partsDone  = jb.parts_done||0;
  const partsSummary = totalParts>1
    ?`<div class="parts-summary">&#128194; ${partsDone}/${totalParts} parts confirmed</div>`:'';

  let dlBlock='';
  const cp = jb.current_part;
  if (cp && !cp.consumed && jb.browser_download) {
    const lbl = totalParts>1
      ?`Part ${cp.part_num} of ${cp.total_parts} &mdash; pages ${cp.pages}`
      :'Your PDF is ready';
    const nxtLbl = cp.part_num < cp.total_parts ? 'Done &mdash; next part' : 'Done &mdash; finish';
    dlBlock=`
<div class="gate-box">
  <div class="gate-label">&#128196; <b>${lbl}</b></div>
  <div class="gate-hint">Save the file to your device, then tap <b>Done</b>.</div>
  <div class="gate-btns">
    <a href="/api/jobs/${jb.id}/download" download="${cp.name}" class="btn btn-dl">&#8595; Download${totalParts>1?' Part '+cp.part_num:''}</a>
    <button class="btn btn-ok" onclick="confirmPart('${jb.id}')">&#10003; ${nxtLbl}</button>
  </div>
</div>`;
  } else if (cp && cp.consumed && jb.browser_download && !isDone) {
    dlBlock=`<div class="gate-waiting"><span class="spin">&#8987;</span> Building part ${(cp.part_num||0)+1}&hellip;</div>`;
  }

  const statusLabel = isDone ? 'Done' : isErr ? 'Error' : isWait ? 'Waiting' : fmtStatus(jb.status);

  return `
<div class="job-card">
  <div class="title-row">
    <div class="book-title">${jb.title}</div>
    <span class="status-pill ${pillCls}">${statusLabel}</span>
  </div>
  <div class="prog-row">
    <div class="bar ${barCls}"><i style="width:${pct}%"></i></div>
    <div class="prog-txt">${jb.done}/${jb.total||'?'} pages</div>
  </div>
  <div class="meta"><span>ID: ${jb.book_id}</span> <span>&bull;</span> <span>${ts}</span></div>
  ${partsSummary}${errMsg}${dlBlock}
</div>`;
}

async function confirmPart(jid) {
  try {
    await fetch(`/api/jobs/${jid}/confirm`,{method:'POST'});
    pollJobs();
  } catch(e) { alert('Error: '+e.message); }
}

async function pollJobs() {
  try {
    const js = await api('/api/jobs');
    const section = $('#jobsSection');
    const el = $('#jobs');
    if (!js.length) {
      section.classList.remove('show');
      el.innerHTML = '';
    } else {
      section.classList.add('show');
      el.innerHTML = js.map(jobCard).join('');
      const mainEmpty = document.getElementById('mainEmpty');
      if (mainEmpty) mainEmpty.remove();
    }
  } catch {}
}

renderMain();
health();
loadCats();
pollJobs();
setInterval(pollJobs, 3000);
$('#loadBooks').onclick = loadBooks;
</script>
</body>
</html>
