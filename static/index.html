<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#090c15"/>
<title>YCT Downloader</title>
<style>
:root {
  --bg: #090c15;
  --surface: #111625;
  --card: #1a2035;
  --border: #232a45;
  --border2: #323a5e;
  --txt: #eef2ff;
  --txt2: #94a3b8;
  --txt3: #64748b;
  --acc: #6366f1;
  --acc2: #818cf8;
  --acc-bg: rgba(99, 102, 241, 0.15);
  --ok: #10b981;
  --ok-bg: rgba(16, 185, 129, 0.12);
  --warn: #f59e0b;
  --warn-bg: rgba(245, 158, 11, 0.12);
  --err: #ef4444;
  --err-bg: rgba(239, 68, 68, 0.12);
  --dl: #0ea5e9;
  --dl-bg: rgba(14, 165, 233, 0.12);
  --r: 14px;
  --r2: 10px;
  --shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--txt);
  font: 14.5px/1.6 'Inter', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.app { display: grid; grid-template-rows: 56px 1fr; height: 100dvh; overflow: hidden; }

header {
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 10;
}
.logo { font-size: 22px; }
header h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.badge {
  margin-left: auto; font-size: 11px; padding: 4px 10px;
  border-radius: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
}
.badge.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid rgba(16,185,129,0.25); }
.badge.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid rgba(245,158,11,0.25); }

.body { display: grid; grid-template-columns: 360px 1fr; overflow: hidden; min-height: 0; }

.sidebar {
  background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden; min-height: 0;
}
.main { overflow-y: auto; padding: 20px; background: var(--bg); min-height: 0; }

/* Category bar (compact, always visible) */
.cat-bar {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; gap: 8px; align-items: center; flex-shrink: 0;
}
.cat-bar select { flex: 1; }
.cat-bar .btn { flex-shrink: 0; padding: 9px 14px; }

/* Books header */
.books-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px 8px; flex-shrink: 0;
}
.books-hd span { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--txt2); }
.books-hd .count { font-size: 11px; color: var(--txt3); font-weight: 600; }

select, input[type=number], input[type=text] {
  width: 100%; background: var(--bg); border: 1px solid var(--border2);
  border-radius: var(--r2); color: var(--txt); padding: 10px 14px;
  font: inherit; outline: none; transition: all 0.2s;
}
select:focus, input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-bg); }
select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; padding-right: 40px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: none; border-radius: var(--r2); font: inherit; font-weight: 600;
  font-size: 13.5px; padding: 10px 18px; cursor: pointer;
  transition: all 0.15s; text-decoration: none;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-pri { background: var(--acc); color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
.btn-pri:hover:not(:disabled) { background: #4f46e5; }
.btn-ghost { background: var(--card); color: var(--txt); border: 1px solid var(--border2); }
.btn-ghost:hover:not(:disabled) { background: var(--border); }
.btn-ok { background: var(--ok-bg); color: var(--ok); border: 1px solid rgba(16,185,129,0.3); }
.btn-ok:hover:not(:disabled) { background: rgba(16,185,129,0.2); }
.btn-dl { background: var(--dl-bg); color: var(--dl); border: 1px solid rgba(14,165,233,0.3); }
.btn-dl:hover:not(:disabled) { background: rgba(14,165,233,0.2); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* Book list - Now with Larger Covers */
.book-list { flex: 1; overflow-y: auto; padding: 4px 12px 12px; min-height: 0; }
.book-item {
  display: flex; align-items: center; gap: 16px; padding: 12px;
  border: 1px solid var(--border); border-radius: var(--r);
  margin-bottom: 10px; cursor: pointer; background: var(--card);
  transition: all 0.15s;
}
.book-item:hover { border-color: var(--border2); background: #1f2742; }
.book-item.sel { border-color: var(--acc); background: var(--acc-bg); box-shadow: 0 0 0 1px var(--acc); }

.book-cover-img {
  width: 72px; height: 100px; object-fit: cover;
  border-radius: 6px; background: var(--surface); flex-shrink: 0;
  border: 1px solid var(--border);
}
.book-icon-fallback {
  width: 72px; height: 100px; display: flex; align-items: center; justify-content: center;
  background: var(--surface); border-radius: 6px; font-size: 32px;
  border: 1px solid var(--border); flex-shrink: 0;
}

.book-item .info { min-width: 0; flex: 1; }
.book-item .name {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; font-size: 14.5px; font-weight: 600; line-height: 1.35;
  margin-bottom: 6px; color: #fff;
}
.book-item .sub { font-size: 13px; color: var(--txt3); font-weight: 500; }

/* Options card */
.opt-card {
  display: none;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow);
}
.opt-card.show { display: block; animation: fadeIn 0.3s ease; }
.opt-card h2 { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--txt2); margin-bottom: 16px; }
.opt-row { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.opt-row label { font-size: 13px; font-weight: 500; color: var(--txt2); display: flex; align-items: center; gap: 8px; }
.opt-row input[type=number] { width: 90px; font-weight: 600; }
.chk-label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--txt2); cursor: pointer; user-select: none; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--acc); cursor: pointer; }

/* Selected info - Even larger cover */
.sel-info {
  display: none; align-items: center; gap: 16px;
  background: linear-gradient(145deg, var(--card), var(--surface));
  border: 1px solid var(--border2); border-radius: var(--r);
  padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.sel-info.show { display: flex; animation: fadeIn 0.3s ease; }

.sel-info-cover, .sel-info-fallback {
  width: 86px; height: 120px; object-fit: cover; border-radius: 8px;
  border: 1px solid var(--border2); flex-shrink: 0;
}
.sel-info-fallback { display: flex; align-items: center; justify-content: center; background: var(--bg); font-size: 36px; }

.sel-details { flex: 1; min-width: 0; }
.sel-details strong { color: #fff; display: block; margin-bottom: 6px; font-size: 16px; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.sel-details span { font-size: 13px; color: var(--acc2); font-weight: 500; background: var(--acc-bg); padding: 4px 10px; border-radius: 6px; display: inline-block; }

/* Jobs */
.jobs-section { display: none; }
.jobs-section.show { display: block; }
.jobs-section h2 { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--txt2); margin-bottom: 12px; }
.job-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
.job-card .title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.job-card .book-title { font-size: 14.5px; font-weight: 600; flex: 1; color: #fff; line-height: 1.35; }
.job-card .status-pill { flex-shrink: 0; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 24px; text-transform: uppercase; letter-spacing: 0.04em; }
.pill-done { background: var(--ok-bg); color: var(--ok); border: 1px solid rgba(16,185,129,0.25); }
.pill-err { background: var(--err-bg); color: var(--err); border: 1px solid rgba(239,68,68,0.25); }
.pill-run { background: var(--acc-bg); color: var(--acc2); border: 1px solid rgba(99,102,241,0.25); }
.pill-queue { background: rgba(255,255,255,0.05); color: var(--txt3); border: 1px solid var(--border); }
.pill-wait { background: var(--dl-bg); color: var(--dl); border: 1px solid rgba(14,165,233,0.25); animation: pulse 2s infinite; }

@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(14,165,233,0.4); } 70% { box-shadow: 0 0 0 6px rgba(14,165,233,0); } 100% { box-shadow: 0 0 0 0 rgba(14,165,233,0); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; animation: spin 1s linear infinite; }

.job-card .prog-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.bar { flex: 1; height: 6px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.bar i { display: block; height: 100%; background: var(--acc); border-radius: 99px; transition: width 0.4s; }
.bar.done i { background: var(--ok); }
.bar.err i { background: var(--err); }
.prog-txt { font-size: 12.5px; font-weight: 600; color: var(--txt); white-space: nowrap; min-width: 60px; text-align: right; }
.job-card .meta { font-size: 12.5px; color: var(--txt3); margin-bottom: 8px; display: flex; gap: 10px; }
.job-card .err-msg { font-size: 12.5px; color: var(--err); margin-bottom: 8px; background: var(--err-bg); padding: 8px 12px; border-radius: 6px; border: 1px solid rgba(239,68,68,0.25); }
.parts-summary { font-size: 12.5px; color: var(--acc2); margin-bottom: 8px; font-weight: 500; }

.gate-box { background: var(--bg); border: 1px solid rgba(14,165,233,0.3); border-radius: var(--r2); padding: 14px; margin-top: 10px; }
.gate-label { font-size: 13.5px; font-weight: 600; color: var(--dl); margin-bottom: 4px; }
.gate-hint { font-size: 12.5px; color: var(--txt2); margin-bottom: 12px; line-height: 1.5; }
.gate-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.gate-waiting { font-size: 12.5px; font-weight: 500; color: var(--txt2); margin-top: 10px; padding: 10px 14px; background: var(--bg); border-radius: var(--r2); border: 1px dashed var(--border2); display: inline-flex; align-items: center; gap: 8px; }

.muted { color: var(--txt3); font-size: 13px; text-align: center; padding: 24px 16px; }

/* Main empty placeholder (desktop only) */
.main-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; color: var(--txt3); padding: 60px 24px; height: 100%;
  background: var(--surface); border: 1px dashed var(--border2); border-radius: var(--r);
}
.main-empty .icon { font-size: 44px; margin-bottom: 14px; opacity: 0.6; }
.main-empty h3 { font-size: 15px; color: var(--txt2); font-weight: 600; margin-bottom: 6px; }
.main-empty p { font-size: 13px; max-width: 320px; }

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; border: 2px solid var(--surface); }

/* Mobile sheet for selected book details */
@media (max-width: 768px) {
  header { padding: 0 14px; }
  .body { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .sidebar { border-right: none; }
  /* Hide the desktop main pane on mobile — replaced by sheet */
  .main { display: none; }

  /* Bottom sheet overlay */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--surface); border-top: 1px solid var(--border);
    border-radius: 20px 20px 0 0; max-height: 88dvh; overflow-y: auto;
    padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
  }
  .sheet.show { transform: translateY(0); }
  .sheet-handle {
    width: 40px; height: 4px; background: var(--border2); border-radius: 99px;
    margin: 0 auto 12px;
  }
  .sheet-close {
    position: absolute; top: 14px; right: 14px;
    background: var(--card); border: 1px solid var(--border2); color: var(--txt2);
    width: 32px; height: 32px; border-radius: 50%; font-size: 18px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }

  /* Inside sheet: show what was hidden in .main */
  .sheet .sel-info, .sheet .opt-card, .sheet .jobs-section { display: none; }
  .sheet .sel-info.show, .sheet .opt-card.show, .sheet .jobs-section.show { display: flex; }
  .sheet .opt-card.show, .sheet .jobs-section.show { display: block; }

  .btn-row .btn { flex: 1; min-width: 0; }
}
@media (min-width: 769px) {
  .sheet, .sheet-backdrop { display: none !important; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="logo">&#128218;</span>
    <h1>YCT Downloader</h1>
    <span class="badge warn" id="health">checking&#8230;</span>
  </header>
  <div class="body">
    <aside class="sidebar">
      <div class="cat-bar">
        <select id="cat"><option>Loading&#8230;</option></select>
        <button class="btn btn-ghost" id="loadBooks">Load</button>
      </div>
      <div class="books-hd">
        <span>Books</span>
        <span class="count" id="bookCount"></span>
      </div>
      <div class="book-list" id="books">
        <div class="muted">Pick a category, then tap Load.</div>
      </div>
    </aside>
    <main class="main" id="mainPane">
      <div id="mainContent">
        <div class="main-empty" id="mainEmpty">
          <div class="icon">&#128218;</div>
          <h3>Select a book to get started</h3>
          <p>Pick a category on the left, choose a book, then queue a download to Telegram or your browser.</p>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Mobile bottom sheet -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="sheetClose" aria-label="Close">&times;</button>
  <div id="sheetContent"></div>
</div>

<!-- Reusable content templates (rendered into desktop main + mobile sheet) -->
<template id="tplDetails">
  <div class="sel-info" id="selInfo">
    <div id="selCoverContainer"></div>
    <div class="sel-details">
      <strong id="selTitle">&#8212;</strong>
      <span id="selMeta"></span>
    </div>
  </div>
  <div class="opt-card" id="optCard">
    <h2>Download options</h2>
    <div class="opt-row">
      <label>Start <input type="number" id="start" value="1" min="1"></label>
      <label>End <input type="number" id="end" placeholder="all"></label>
      <label class="chk-label" style="margin-left:auto;"><input type="checkbox" id="ocr"> OCR</label>
    </div>
    <div class="btn-row">
      <button class="btn btn-pri" id="goTelegram">&#9992; Telegram</button>
      <button class="btn btn-dl" id="goBrowser">&#8595; Browser</button>
      <button class="btn btn-ok" id="goBoth">&#9889; Both</button>
    </div>
  </div>
  <div class="jobs-section" id="jobsSection">
    <h2>Active &amp; Recent Jobs</h2>
    <div id="jobs"></div>
  </div>
</template>

<script>
const $ = s => document.querySelector(s);
let selected = null;
const isMobile = () => window.matchMedia('(max-width: 768px)').matches;

// Render template into desktop main pane on load
function renderMain() {
  const tpl = document.getElementById('tplDetails').content.cloneNode(true);
  document.getElementById('mainContent').appendChild(tpl);
  bindActions();
}

function bindActions() {
  $('#goTelegram').onclick = ()=>go({telegram:true,browser:false});
  $('#goBrowser').onclick  = ()=>go({telegram:false,browser:true});
  $('#goBoth').onclick     = ()=>go({telegram:true,browser:true});
}

// On mobile, content lives inside the sheet. Move it in/out as needed.
function moveContentToSheet() {
  const sheet = document.getElementById('sheetContent');
  const main = document.getElementById('mainContent');
  while (main.firstChild) sheet.appendChild(main.firstChild);
}
function moveContentToMain() {
  const sheet = document.getElementById('sheetContent');
  const main = document.getElementById('mainContent');
  while (sheet.firstChild) main.appendChild(sheet.firstChild);
}

function openSheet() {
  if (!isMobile()) return;
  moveContentToSheet();
  document.getElementById('sheet').classList.add('show');
  document.getElementById('sheetBackdrop').classList.add('show');
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('sheetBackdrop').classList.remove('show');
  // After close transition, move content back so it stays in DOM accessibly
  setTimeout(moveContentToMain, 250);
}
document.getElementById('sheetClose').onclick = closeSheet;
document.getElementById('sheetBackdrop').onclick = closeSheet;

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.status);
  return r.json();
}

function fmtStatus(s) {
  if (!s) return '';
  return s.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
}
function pillClass(status) {
  if (status === 'done') return 'pill-done';
  if (status === 'error') return 'pill-err';
  if (status === 'queued') return 'pill-queue';
  if ((status||'').startsWith('waiting_user')) return 'pill-wait';
  return 'pill-run';
}

async function health() {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 8000);
    const r = await fetch('/healthz', {signal: ctrl.signal});
    clearTimeout(timer);
    const h = await r.json();
    const el = $('#health');
    if (h.ok) { el.textContent='ready'; el.className='badge ok'; }
    else { el.textContent='env missing'; el.className='badge warn'; }
  } catch {
    $('#health').textContent='starting...';
    setTimeout(health, 4000);
  }
}

async function loadCats() {
  const sel = $('#cat');
  sel.innerHTML = '<option>Loading...</option>';
  for (let attempt = 1; attempt <= 5; attempt++) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), 35000);
      const r = await fetch('/api/categories', {signal: ctrl.signal});
      clearTimeout(timer);
      if (!r.ok) {
        const err = await r.json().catch(()=>({detail:'server error'}));
        throw new Error(err.detail || r.status);
      }
      const cats = await r.json();
      if (!cats.length) { sel.innerHTML='<option>No categories found</option>'; return; }
      sel.innerHTML = cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
      return;
    } catch(e) {
      if (attempt < 5) {
        sel.innerHTML=`<option>Retrying (${attempt}/5)...</option>`;
        await new Promise(r=>setTimeout(r, 3000));
      } else {
        sel.innerHTML=`<option>Failed: ${e.message}</option>`;
      }
    }
  }
}

async function loadBooks() {
  const cat = $('#cat').value;
  const btn = $('#loadBooks');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin">&#8987;</span>';
  $('#books').innerHTML = '<div class="muted"><span class="spin">&#8987;</span> Fetching books&hellip;</div>';
  $('#bookCount').textContent = '';
  try {
    const books = await api('/api/books?cat='+cat);
    if (!books.length) { $('#books').innerHTML='<div class="muted">No books found.</div>'; return; }
    $('#bookCount').textContent = books.length + ' books';
    $('#books').innerHTML = books.map(b => {
      const coverUrl = b.cover || '';
      const coverHtml = coverUrl
        ? `<img src="${coverUrl}" class="book-cover-img" alt="cover" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=\\'book-icon-fallback\\'>📚</div>'"/>`
        : `<div class="book-icon-fallback">📚</div>`;
      return `
      <div class="book-item" data-id="${b.book_id}" data-name="${encodeURIComponent(b.name)}" data-cover="${encodeURIComponent(coverUrl)}">
        ${coverHtml}
        <div class="info">
          <div class="name">${b.name}</div>
          <div class="sub">ID: ${b.book_id}</div>
        </div>
      </div>`;
    }).join('');
    document.querySelectorAll('.book-item').forEach(el=>el.onclick=()=>selectBook(el));
  } catch(e) {
    $('#books').innerHTML=`<div class="muted">Error: ${e.message}</div>`;
  } finally {
    btn.disabled=false; btn.textContent='Load';
  }
}

async function selectBook(el) {
  document.querySelectorAll('.book-item').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');

  const coverUrl = decodeURIComponent(el.dataset.cover);
  selected = {
    book_id: +el.dataset.id,
    title: decodeURIComponent(el.dataset.name),
    cover: coverUrl,
    total: null
  };

  // hide empty placeholder
  const mainEmpty = document.getElementById('mainEmpty');
  if (mainEmpty) mainEmpty.remove();

  $('#selInfo').classList.add('show');
  $('#selTitle').textContent = selected.title;
  $('#optCard').classList.add('show');

  const selCoverHtml = coverUrl
    ? `<img src="${coverUrl}" class="sel-info-cover" alt="cover" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=\\'sel-info-fallback\\'>📚</div>'"/>`
    : `<div class="sel-info-fallback">📚</div>`;
  $('#selCoverContainer').innerHTML = selCoverHtml;
  $('#selMeta').innerHTML = `<span class="spin" style="font-size:10px; margin-right:4px;">&#8987;</span> Checking pages&hellip;`;

  // Open mobile sheet
  openSheet();

  try {
    const p = await api('/api/pages?book_id='+selected.book_id);
    selected.total = p.total_pages;
    $('#selMeta').innerHTML = `&#128196; ${p.total_pages||'Unknown'} pages &nbsp;&middot;&nbsp; ID ${selected.book_id}`;
    if (p.total_pages) $('#end').placeholder=`all (${p.total_pages})`;
  } catch {
    $('#selMeta').innerHTML = `ID ${selected.book_id}`;
  }
}

async function go({telegram, browser}) {
  if (!selected) { alert('Select a book first.'); return; }
  const body = {
    book_id:selected.book_id, title:selected.title, cover:selected.cover,
    start:+$('#start').value||1,
    end:$('#end').value?(+$('#end').value):null,
    do_ocr:$('#ocr').checked,
    total_pages:selected.total||null,
    browser_download:browser,
    telegram:telegram,
  };
  try {
    await api('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    pollJobs();
  } catch(e) { alert('Failed to queue: '+e.message); }
}

function jobCard(jb) {
  const pct = jb.total ? Math.round(jb.done*100/jb.total) : 0;
  const isDone = jb.status==='done';
  const isErr  = jb.status==='error';
  const isWait = (jb.status||'').startsWith('waiting_user');
  const barCls = isDone?'done':isErr?'err':'';
  const pillCls= pillClass(jb.status);
  const ts = new Date(jb.ts*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const errMsg = isErr?`<div class="err-msg">&#9888; Failed: ${jb.error||'Unknown error'}</div>`:'';
  const totalParts = jb.total_parts||0;
  const partsDone  = jb.parts_done||0;
  const partsSummary = totalParts>1
    ?`<div class="parts-summary">&#128194; ${partsDone}/${totalParts} parts confirmed</div>`:'';

  let dlBlock='';
  const cp = jb.current_part;
  if (cp && !cp.consumed && jb.browser_download) {
    const lbl = totalParts>1
      ?`Part ${cp.part_num} of ${cp.total_parts} &mdash; pages ${cp.pages}`
      :'Your PDF is ready';
    const nxtLbl = cp.part_num < cp.total_parts ? 'Done &mdash; next part' : 'Done &mdash; finish';
    dlBlock=`
<div class="gate-box">
  <div class="gate-label">&#128196; <b>${lbl}</b></div>
  <div class="gate-hint">Save the file to your device, then tap <b>Done</b>.</div>
  <div class="gate-btns">
    <a href="/api/jobs/${jb.id}/download" download="${cp.name}" class="btn btn-dl">&#8595; Download${totalParts>1?' Part '+cp.part_num:''}</a>
    <button class="btn btn-ok" onclick="confirmPart('${jb.id}')">&#10003; ${nxtLbl}</button>
  </div>
</div>`;
  } else if (cp && cp.consumed && jb.browser_download && !isDone) {
    dlBlock=`<div class="gate-waiting"><span class="spin">&#8987;</span> Building part ${(cp.part_num||0)+1}&hellip;</div>`;
  }

  const statusLabel = isDone ? 'Done' : isErr ? 'Error' : isWait ? 'Waiting' : fmtStatus(jb.status);

  return `
<div class="job-card">
  <div class="title-row">
    <div class="book-title">${jb.title}</div>
    <span class="status-pill ${pillCls}">${statusLabel}</span>
  </div>
  <div class="prog-row">
    <div class="bar ${barCls}"><i style="width:${pct}%"></i></div>
    <div class="prog-txt">${jb.done}/${jb.total||'?'} pages</div>
  </div>
  <div class="meta"><span>ID: ${jb.book_id}</span> <span>&bull;</span> <span>${ts}</span></div>
  ${partsSummary}${errMsg}${dlBlock}
</div>`;
}

async function confirmPart(jid) {
  try {
    await fetch(`/api/jobs/${jid}/confirm`,{method:'POST'});
    pollJobs();
  } catch(e) { alert('Error: '+e.message); }
}

async function pollJobs() {
  try {
    const js = await api('/api/jobs');
    const section = $('#jobsSection');
    const el = $('#jobs');
    if (!js.length) {
      // Hide section entirely when no jobs exist
      section.classList.remove('show');
      el.innerHTML = '';
    } else {
      section.classList.add('show');
      el.innerHTML = js.map(jobCard).join('');
      // If jobs exist but no book was selected, remove the empty placeholder
      const mainEmpty = document.getElementById('mainEmpty');
      if (mainEmpty) mainEmpty.remove();
    }
  } catch {}
}

renderMain();
health();
loadCats();
pollJobs();
setInterval(pollJobs, 3000);
$('#loadBooks').onclick = loadBooks;
</script>
</body>
