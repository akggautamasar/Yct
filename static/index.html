<style>
/* --- THEME VARIABLES --- */
:root {
  /* DARK / SCI-FI THEME (Default) */
  --bg: #05060f;
  --bg-grad-1: #060816;
  --bg-grad-2: #0d0b29;
  --bg-grad-3: #03141f;
  --surface: rgba(10, 14, 30, 0.55);
  --surface-solid: #0b0f22;
  --card: rgba(13, 18, 38, 0.55);
  --card-hover: rgba(22, 28, 56, 0.75);
  --border: rgba(0, 240, 255, 0.18);
  --border2: rgba(0, 240, 255, 0.35);

  --txt: #eafcff;
  --txt2: #a9c4d8;
  --txt3: #5f7a91;

  --acc: #00f0ff;
  --acc-hover: #6cf6ff;
  --acc-bg: rgba(0, 240, 255, 0.12);
  --acc-glow: rgba(0, 240, 255, 0.55);

  --acc2: #ff2bd6;
  --acc2-bg: rgba(255, 43, 214, 0.12);
  --acc2-glow: rgba(255, 43, 214, 0.55);

  --ok: #00ffa3;
  --ok-bg: rgba(0, 255, 163, 0.12);
  --warn: #ffb800;
  --warn-bg: rgba(255, 184, 0, 0.12);
  --err: #ff3860;
  --err-bg: rgba(255, 56, 96, 0.12);
  --dl: #ff2bd6;
  --dl-bg: rgba(255, 43, 214, 0.12);

  --r-lg: 18px;
  --r-md: 12px;
  --r-sm: 8px;

  --shadow-sm: 0 4px 14px -2px rgba(0, 0, 0, 0.6);
  --shadow-md: 0 10px 30px -5px rgba(0, 0, 0, 0.7);
  --shadow-book: 0 8px 20px rgba(0, 0, 0, 0.6);
  --shadow-glow: 0 0 40px rgba(0, 240, 255, 0.25);

  --glass-blur: 18px;
  --glass-border: rgba(0, 240, 255, 0.15);
  --font-display: 'Orbitron', 'Space Grotesk', sans-serif;
  --font-body: 'Space Grotesk', 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

[data-theme="light"] {
  /* LIGHT / HOLO THEME */
  --bg: #eef3fb;
  --bg-grad-1: #eef3fb;
  --bg-grad-2: #e3eafc;
  --bg-grad-3: #dff7f3;
  --surface: rgba(255, 255, 255, 0.6);
  --surface-solid: #ffffff;
  --card: rgba(255, 255, 255, 0.62);
  --card-hover: rgba(255, 255, 255, 0.88);
  --border: rgba(0, 150, 180, 0.22);
  --border2: rgba(0, 150, 180, 0.4);

  --txt: #061320;
  --txt2: #2c4257;
  --txt3: #5e7588;

  --acc: #0098ad;
  --acc-hover: #00b6cf;
  --acc-bg: rgba(0, 152, 173, 0.12);
  --acc-glow: rgba(0, 152, 173, 0.35);

  --acc2: #d6168f;
  --acc2-bg: rgba(214, 22, 143, 0.1);
  --acc2-glow: rgba(214, 22, 143, 0.3);

  --ok: #00946a;
  --ok-bg: rgba(0, 148, 106, 0.12);
  --warn: #b5790a;
  --warn-bg: rgba(181, 121, 10, 0.12);
  --err: #d6204a;
  --err-bg: rgba(214, 32, 74, 0.12);
  --dl: #d6168f;
  --dl-bg: rgba(214, 22, 143, 0.1);

  --shadow-sm: 0 2px 8px -1px rgba(0, 50, 70, 0.08);
  --shadow-md: 0 10px 25px -5px rgba(0, 50, 70, 0.12);
  --shadow-book: 0 8px 18px rgba(0, 50, 70, 0.15);
  --shadow-glow: 0 0 30px rgba(0, 152, 173, 0.2);

  --glass-blur: 18px;
  --glass-border: rgba(0, 150, 180, 0.18);
}

/* --- GLOBAL STYLES --- */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--txt);
  font: 14.5px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.5s ease, color 0.5s ease;
  overflow: hidden;
  position: relative;
}

/* --- ANIMATED GRADIENT BACKGROUND --- */
.bg-gradient {
  position: fixed; inset: 0; z-index: -4;
  background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%);
  background-size: 300% 300%;
  animation: gradientShift 20s ease infinite;
  transition: background 0.5s ease;
}
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* --- CYBER GRID FLOOR --- */
.cyber-grid {
  position: fixed; inset: -10% -10% -10% -10%; z-index: -3; pointer-events: none;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 42px 42px;
  transform: perspective(500px) rotateX(72deg) translateY(0);
  transform-origin: bottom;
  opacity: 0.55;
  animation: gridScroll 9s linear infinite;
  -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 65%);
  mask-image: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 65%);
}
@keyframes gridScroll { from { background-position: 0 0; } to { background-position: 0 42px; } }
[data-theme="light"] .cyber-grid { opacity: 0.3; }

/* --- GLOW ORBS --- */
.glow-orbs { position: fixed; inset: 0; z-index: -3; pointer-events: none; overflow: hidden; }
.orb {
  position: absolute; border-radius: 50%; filter: blur(60px);
  animation: orbDrift ease-in-out infinite;
  will-change: transform;
}
.orb1 { width: 420px; height: 420px; left: -10%; top: -8%; background: var(--acc); opacity: 0.18; animation-duration: 18s; }
.orb2 { width: 380px; height: 380px; right: -8%; top: 30%; background: var(--acc2); opacity: 0.16; animation-duration: 22s; animation-delay: -4s; }
.orb3 { width: 320px; height: 320px; left: 30%; bottom: -15%; background: var(--ok); opacity: 0.10; animation-duration: 26s; animation-delay: -9s; }
@keyframes orbDrift {
  0%, 100% { transform: translate(0,0) scale(1); }
  33% { transform: translate(40px,-30px) scale(1.12); }
  66% { transform: translate(-30px,25px) scale(0.92); }
}

/* --- SCANLINES + VIGNETTE --- */
.scanlines {
  position: fixed; inset: 0; z-index: 50; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
  mix-blend-mode: overlay; opacity: 0.5;
}
.vignette {
  position: fixed; inset: 0; z-index: 49; pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.45) 100%);
}
[data-theme="light"] .scanlines { opacity: 0.15; }
[data-theme="light"] .vignette { background: radial-gradient(ellipse at center, transparent 60%, rgba(0,40,60,0.08) 100%); }

/* --- FLOATING PARTICLES --- */
.particles { position: fixed; inset: 0; z-index: -2; pointer-events: none; overflow: hidden; }
.particle {
  position: absolute; border-radius: 50%;
  background: var(--acc); opacity: 0.15; box-shadow: 0 0 8px 1px var(--acc-glow);
  animation: floatParticle linear infinite;
  will-change: transform, opacity;
}
.particle:nth-child(odd) { background: var(--acc2); box-shadow: 0 0 8px 1px var(--acc2-glow); }
@keyframes floatParticle {
  0% { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
  10% { opacity: 0.5; transform: translateY(90vh) translateX(10px) scale(1); }
  90% { opacity: 0.5; }
  100% { transform: translateY(-10vh) translateX(-20px) scale(0.5); opacity: 0; }
}

.app { display: grid; grid-template-rows: 64px 1fr; height: 100dvh; overflow: hidden; position: relative; z-index: 1; }

/* --- HEADER --- */
header {
  display: flex; align-items: center; gap: 14px; padding: 0 20px;
  background: var(--surface);
  backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
  border-bottom: 1px solid var(--glass-border);
  box-shadow: 0 1px 0 var(--acc-glow), 0 8px 24px -10px rgba(0,0,0,0.6);
  position: sticky; top: 0; z-index: 20;
  transition: background-color 0.5s ease, border-color 0.5s ease;
  animation: slideDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-20px); }
  to { opacity: 1; transform: translateY(0); }
}
.logo {
  font-size: 24px; filter: drop-shadow(0 0 8px var(--acc-glow));
  animation: logoFloat 3s ease-in-out infinite;
  display: flex; align-items: center; justify-content: center;
  width: 38px; height: 38px; border-radius: 10px;
  background: linear-gradient(145deg, var(--acc-bg), var(--acc2-bg));
  border: 1px solid var(--border2);
}
@keyframes logoFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-3px) rotate(-3deg); }
}
header h1 {
  font-family: var(--font-display); font-size: 16px; font-weight: 800;
  letter-spacing: 0.06em; flex: 1; text-transform: uppercase;
  background: linear-gradient(90deg, var(--acc) 0%, var(--txt) 35%, var(--acc2) 70%, var(--acc) 100%);
  background-size: 200% auto;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: titleSheen 6s linear infinite;
  position: relative;
}
@keyframes titleSheen { to { background-position: 200% center; } }
header h1::after {
  content: ''; position: absolute; left: 0; bottom: -3px; height: 1px; width: 36px;
  background: linear-gradient(90deg, var(--acc), transparent);
}

.theme-toggle {
  background: var(--card); border: 1px solid var(--border2); color: var(--acc);
  width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden; position: relative; box-shadow: 0 0 0 0 var(--acc-glow);
}
.theme-toggle:hover { background: var(--card-hover); transform: scale(1.1) rotate(15deg); border-color: var(--acc); box-shadow: 0 0 16px var(--acc-glow); }
.theme-toggle svg { width: 18px; height: 18px; fill: currentColor; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
[data-theme="light"] .icon-moon { display: block; }
[data-theme="light"] .icon-sun { display: none; }
:root:not([data-theme="light"]) .icon-moon { display: none; }
:root:not([data-theme="light"]) .icon-sun { display: block; }

.badge {
  font-family: var(--font-mono);
  font-size: 11px; padding: 6px 12px; border-radius: 6px;
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  animation: badgePulse 3s ease-in-out infinite;
}
@keyframes badgePulse {
  0%, 100% { box-shadow: 0 0 0 0 currentColor; }
  50% { box-shadow: 0 0 10px -2px currentColor; }
}
.badge.ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }

/* --- LAYOUT --- */
.body { display: grid; grid-template-columns: 420px 1fr; overflow: hidden; min-height: 0; }

.sidebar {
  background: var(--surface);
  backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
  border-right: 1px solid var(--glass-border);
  display: flex; flex-direction: column; overflow: hidden; min-height: 0;
  transition: background-color 0.5s ease, border-color 0.5s ease;
  animation: slideRight 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
}
@keyframes slideRight {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}
.main {
  overflow-y: auto; padding: 24px; background: transparent; min-height: 0;
  transition: background-color 0.5s ease;
  animation: fadeIn 0.8s ease 0.2s both;
  scroll-behavior: smooth;
}

/* Parallax scroll effect */
.main { perspective: 1px; }

/* --- SIDEBAR COMPONENTS --- */
.cat-bar {
  padding: 16px; border-bottom: 1px solid var(--glass-border);
  display: flex; gap: 10px; align-items: center; flex-shrink: 0;
}
.cat-bar select { flex: 1; font-weight: 600; }
.cat-bar .btn { flex-shrink: 0; padding: 11px 18px; }

.books-hd {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px 8px; flex-shrink: 0;
}
.books-hd span { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--txt3); }
.books-hd .count {
  font-family: var(--font-mono); font-size: 12px; color: var(--acc); font-weight: 700; background: var(--acc-bg);
  padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border2);
  transition: all 0.3s ease;
}

/* --- FORM ELEMENTS --- */
select, input[type=number], input[type=text] {
  width: 100%; background: var(--bg); border: 1px solid var(--border2);
  border-radius: var(--r-sm); color: var(--txt); padding: 12px 16px;
  font: inherit; outline: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
select:focus, input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-bg), 0 0 14px var(--acc-glow); transform: translateY(-1px); }
select { cursor: pointer; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300f0ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 14px center; background-size: 16px; padding-right: 40px; }

/* --- BUTTONS --- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: none; border-radius: var(--r-sm); font: inherit; font-weight: 700;
  font-size: 13.5px; padding: 12px 20px; cursor: pointer; letter-spacing: 0.02em;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); text-decoration: none;
  position: relative; overflow: hidden;
}
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-pri { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: #03060d; box-shadow: 0 4px 18px var(--acc-glow); }
.btn-pri:hover:not(:disabled) { filter: brightness(1.12); transform: translateY(-2px); box-shadow: 0 8px 26px var(--acc-glow), 0 0 30px var(--acc2-glow); }
.btn-ghost { background: var(--card); color: var(--txt); border: 1px solid var(--border2); box-shadow: var(--shadow-sm); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.btn-ghost:hover:not(:disabled) { background: var(--card-hover); border-color: var(--acc); box-shadow: 0 0 14px var(--acc-glow); transform: translateY(-1px); }
.btn-ok { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
.btn-ok:hover:not(:disabled) { background: rgba(0,255,163,0.22); box-shadow: 0 0 16px rgba(0,255,163,0.35); transform: translateY(-1px); }
.btn-dl { background: var(--dl-bg); color: var(--dl); border: 1px solid var(--dl); }
.btn-dl:hover:not(:disabled) { background: rgba(255,43,214,0.2); box-shadow: 0 0 16px var(--acc2-glow); transform: translateY(-1px); }
.btn-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }

/* Ripple effect */
.ripple {
  position: absolute; border-radius: 50%;
  background: rgba(255, 255, 255, 0.5); transform: scale(0);
  animation: rippleAnim 0.6s ease-out; pointer-events: none;
}
@keyframes rippleAnim {
  to { transform: scale(4); opacity: 0; }
}

/* --- BEAUTIFUL GRID GALLERY --- */
.book-list {
  flex: 1; overflow-y: auto; padding: 8px 16px 20px; min-height: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 16px; align-content: start;
}
.book-list > .muted { grid-column: 1 / -1; }

/* Skeleton loader */
.skeleton-card {
  display: flex; flex-direction: column; padding: 10px;
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--card);
}
.skeleton-cover {
  width: 100%; aspect-ratio: 3 / 4; border-radius: 8px;
  background: linear-gradient(90deg, var(--border) 25%, var(--card-hover) 50%, var(--border) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite;
  margin-bottom: 12px;
}
.skeleton-line {
  height: 14px; border-radius: 6px; margin: 4px auto;
  background: linear-gradient(90deg, var(--border) 25%, var(--card-hover) 50%, var(--border) 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite;
}
.skeleton-line.short { width: 60%; }
.skeleton-line.mid { width: 80%; }
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.book-item {
  display: flex; flex-direction: column; align-items: stretch;
  padding: 10px;
  border: 1px solid var(--border); border-radius: var(--r-md);
  cursor: pointer; background: var(--card);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: var(--shadow-sm);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transform-style: preserve-3d; will-change: transform;
  opacity: 0; animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  position: relative;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.book-item:hover {
  border-color: var(--acc); transform: translateY(-6px) scale(1.02);
  box-shadow: var(--shadow-md), 0 0 24px var(--acc-glow);
}
.book-item.sel {
  border-color: var(--acc); background: var(--acc-bg);
  box-shadow: 0 0 0 2px var(--acc), 0 0 34px var(--acc-glow);
  transform: translateY(-3px) scale(1.02);
}
.book-item.sel::before {
  content: ''; position: absolute; inset: -2px; border-radius: var(--r-md);
  background: radial-gradient(circle at center, var(--acc-glow), transparent 70%);
  z-index: -1; animation: glowPulse 2s ease-in-out infinite;
}
@keyframes glowPulse {
  0%, 100% { opacity: 0.5; transform: scale(1); }
  50% { opacity: 0.8; transform: scale(1.05); }
}

/* HUGE GRID COVERS */
.book-cover-img {
  width: 100%; height: auto; aspect-ratio: 3 / 4; object-fit: cover;
  border-radius: 8px; background: var(--surface);
  border: 1px solid rgba(0,0,0,0.1);
  box-shadow: var(--shadow-book); margin-bottom: 12px;
  transition: transform 0.3s ease;
}
.book-item:hover .book-cover-img { transform: scale(1.05); }
.book-icon-fallback {
  width: 100%; height: auto; aspect-ratio: 3 / 4;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); border-radius: 8px; font-size: 40px;
  border: 1px solid var(--border); box-shadow: var(--shadow-book);
  margin-bottom: 12px; transition: transform 0.3s ease;
}
.book-item:hover .book-icon-fallback { transform: scale(1.05); }

.book-item .info { display: flex; flex-direction: column; align-items: center; text-align: center; }
.book-item .name {
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; font-size: 13.5px; font-weight: 700; line-height: 1.4;
  margin-bottom: 6px; color: var(--txt);
}
.book-item .sub {
  font-family: var(--font-mono);
  font-size: 11px; color: var(--txt3); font-weight: 700;
  display: inline-flex; background: var(--bg); padding: 2px 8px;
  border-radius: 6px; border: 1px solid var(--border);
  transition: all 0.3s ease;
}
.book-item:hover .sub { color: var(--acc); border-color: var(--acc); box-shadow: 0 0 8px var(--acc-glow); }

/* --- OPTIONS CARD --- */
.opt-card {
  display: none;
  background: var(--card); border: 1px solid var(--glass-border);
  border-radius: var(--r-lg); padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow-md);
  backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
}
.opt-card.show { display: block; animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
.opt-card h2 { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--acc); margin-bottom: 20px; }
.opt-row { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.opt-row label { font-size: 14px; font-weight: 600; color: var(--txt2); display: flex; align-items: center; gap: 10px; }
.opt-row input[type=number] { width: 100px; font-weight: 700; text-align: center; }
.chk-label { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--txt2); cursor: pointer; user-select: none; transition: color 0.3s ease; }
.chk-label:hover { color: var(--txt); }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--acc); cursor: pointer; border-radius: 4px; transition: transform 0.2s ease; }
input[type=checkbox]:checked { transform: scale(1.1); }

/* --- SELECTED BOOK HERO --- */
.sel-info {
  display: none; align-items: center; gap: 24px;
  background: linear-gradient(135deg, var(--card), var(--surface));
  border: 1px solid var(--glass-border); border-radius: var(--r-lg);
  padding: 24px; margin-bottom: 24px; box-shadow: var(--shadow-md);
  backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
  position: relative; overflow: hidden;
}
.sel-info.show { display: flex; animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
.sel-info::after {
  content: ''; position: absolute; top: -50%; right: -20%; width: 300px; height: 300px;
  background: radial-gradient(circle, var(--acc-glow), transparent 70%);
  pointer-events: none; animation: glowPulse 4s ease-in-out infinite;
}

.sel-info-cover, .sel-info-fallback {
  width: 100px; height: 144px; object-fit: cover; border-radius: 8px;
  border: 1px solid rgba(0,0,0,0.1); flex-shrink: 0;
  box-shadow: var(--shadow-book); position: relative; z-index: 1;
  transition: transform 0.3s ease;
}
.sel-info:hover .sel-info-cover, .sel-info:hover .sel-info-fallback { transform: scale(1.05) rotate(-2deg); }
.sel-info-fallback { display: flex; align-items: center; justify-content: center; background: var(--surface); font-size: 48px; }

.sel-details { flex: 1; min-width: 0; position: relative; z-index: 1; }
.sel-details strong {
  color: var(--txt); display: block; margin-bottom: 12px; font-size: 18px; font-weight: 800; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.sel-details span {
  font-size: 13.5px; color: var(--acc); font-weight: 700; background: var(--acc-bg);
  padding: 6px 12px; border-radius: 8px; display: inline-block;
  border: 1px solid rgba(99,102,241,0.2); transition: all 0.3s ease;
}

/* --- JOBS SECTION --- */
.jobs-section { display: none; }
.jobs-section.show { display: block; animation: fadeIn 0.5s ease; }
.jobs-section h2 { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--acc); margin-bottom: 16px; }
.job-card {
  background: var(--card); border: 1px solid var(--glass-border); border-radius: var(--r-md);
  padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.job-card:hover { border-color: var(--acc); transform: translateY(-3px); box-shadow: var(--shadow-md), 0 0 18px var(--acc-glow); }
.job-card .title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 16px; }
.job-card .book-title { font-size: 16px; font-weight: 700; flex: 1; color: var(--txt); line-height: 1.35; }
.job-card .status-pill {
  flex-shrink: 0; font-size: 12px; font-weight: 800; padding: 6px 14px; border-radius: 30px;
  text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.3s ease;
}
.job-cancel {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
  border: 1px solid var(--border2); background: var(--bg); color: var(--txt3);
  font-size: 16px; line-height: 1; cursor: pointer; display: flex;
  align-items: center; justify-content: center; padding: 0;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.job-cancel:hover {
  color: var(--err); border-color: var(--err); background: var(--err-bg);
  box-shadow: 0 0 12px rgba(255, 56, 96, 0.4); transform: rotate(90deg) scale(1.1);
}

.pill-done { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
.pill-err { background: var(--err-bg); color: var(--err); border: 1px solid var(--err); }
.pill-run { background: var(--acc-bg); color: var(--acc); border: 1px solid var(--acc); animation: pillPulse 2s infinite; }
.pill-queue { background: var(--bg); color: var(--txt3); border: 1px solid var(--border); }
.pill-wait { background: var(--dl-bg); color: var(--dl); border: 1px solid var(--dl); animation: pulse 2s infinite; }

@keyframes pillPulse {
  0%, 100% { box-shadow: 0 0 0 0 var(--acc-glow); }
  50% { box-shadow: 0 0 0 6px transparent, 0 0 14px var(--acc-glow); }
}
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--acc2-glow); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { display: inline-block; animation: spin 1s linear infinite; }

.job-card .prog-row { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
.bar { flex: 1; height: 7px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
.bar i {
  display: block; height: 100%; background: linear-gradient(90deg, var(--acc), var(--acc2)); border-radius: 99px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative; overflow: hidden; box-shadow: 0 0 10px var(--acc-glow);
}
.bar i::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation: barShine 2s infinite;
}
@keyframes barShine {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}
.bar.done i { background: var(--ok); }
.bar.err i { background: var(--err); }
.prog-txt { font-size: 14px; font-weight: 700; color: var(--txt2); white-space: nowrap; min-width: 65px; text-align: right; }
.job-card .meta { font-size: 13.5px; color: var(--txt3); margin-bottom: 10px; display: flex; gap: 12px; font-weight: 500; }
.job-card .err-msg {
  font-size: 13.5px; font-weight: 600; color: var(--err); margin-bottom: 12px;
  background: var(--err-bg); padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(239,68,68,0.2);
  animation: slideUp 0.3s ease;
}
.parts-summary { font-size: 13.5px; color: var(--acc); margin-bottom: 12px; font-weight: 600; }

.gate-box {
  background: var(--bg); border: 1px dashed var(--dl); border-radius: var(--r-md);
  padding: 20px; margin-top: 16px; animation: slideUp 0.4s ease;
  transition: all 0.3s ease;
}
.gate-box:hover { border-color: var(--dl); box-shadow: 0 0 20px var(--acc2-glow); }
.gate-label { font-size: 15px; font-weight: 700; color: var(--dl); margin-bottom: 6px; }
.gate-hint { font-size: 14px; font-weight: 500; color: var(--txt2); margin-bottom: 16px; line-height: 1.5; }
.gate-btns { display: flex; gap: 12px; flex-wrap: wrap; }
.gate-waiting {
  font-size: 14px; font-weight: 600; color: var(--txt2); margin-top: 16px; padding: 14px 20px;
  background: var(--bg); border-radius: var(--r-md); border: 1px dashed var(--border2);
  display: inline-flex; align-items: center; gap: 10px;
}

.muted { color: var(--txt3); font-size: 14px; font-weight: 500; text-align: center; padding: 40px 20px; }

/* Main empty placeholder */
.main-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; color: var(--txt3); padding: 80px 24px; height: 100%;
  background: var(--card); border: 1px dashed var(--border2); border-radius: var(--r-lg);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  animation: fadeIn 0.8s ease 0.3s both;
  box-shadow: inset 0 0 60px rgba(0,240,255,0.04);
}
.main-empty .icon {
  font-size: 52px; margin-bottom: 20px; opacity: 0.9; filter: drop-shadow(0 0 16px var(--acc-glow));
  animation: logoFloat 3s ease-in-out infinite;
}
.main-empty h3 { font-family: var(--font-display); font-size: 16px; color: var(--txt); font-weight: 700; margin-bottom: 10px; letter-spacing: 0.02em; }
.main-empty p { font-size: 14px; max-width: 360px; line-height: 1.6; }

/* --- EBOOK READER OVERLAY --- */
.reader-preview-btn { margin-top: 12px; width: 100%; font-size: 13px; padding: 10px 16px; }

.reader-overlay {
  position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column;
  background: radial-gradient(circle at 50% 30%, #0d0b29 0%, #03040c 75%);
  opacity: 0; pointer-events: none; visibility: hidden;
  transition: opacity 0.3s ease;
}
.reader-overlay.show { opacity: 1; pointer-events: auto; visibility: visible; }
[data-theme="light"] .reader-overlay { background: radial-gradient(circle at 50% 30%, #e3eafc 0%, #cfe0f0 80%); }

.reader-top {
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--glass-border);
  background: var(--surface); backdrop-filter: blur(var(--glass-blur));
}
.reader-title {
  font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: 0.04em;
  color: var(--txt); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  flex: 1 1 auto; min-width: 0;
}
.reader-toolbar { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.reader-tool {
  width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border2);
  background: var(--card); color: var(--acc); font-size: 16px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
}
.reader-tool:hover { border-color: var(--acc); box-shadow: 0 0 10px var(--acc-glow); transform: translateY(-1px); }
.reader-tool.active { color: var(--acc2); border-color: var(--acc2); }
.reader-zoom-lvl {
  font-family: var(--font-mono); font-size: 11px; color: var(--txt3); width: 42px; text-align: center;
  user-select: none;
}
.reader-close {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border2);
  background: var(--card); color: var(--txt2); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: all 0.25s ease;
}
.reader-close:hover { color: var(--err); border-color: var(--err); box-shadow: 0 0 12px rgba(255,56,96,0.4); transform: rotate(90deg); }

.reader-stage { flex: 1; display: flex; align-items: center; gap: 8px; padding: 10px; min-height: 0; overflow: hidden; }
.reader-page-wrap {
  flex: 1; height: 100%; display: flex; align-items: center; justify-content: center;
  position: relative; min-width: 0; overflow: hidden; touch-action: none;
}
.reader-zoom-wrap {
  display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;
  transform: translate(0px, 0px) scale(1); transform-origin: center center;
  will-change: transform;
}
.reader-zoom-wrap.panning { transition: none; }
.reader-zoom-wrap.snap { transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); }
.reader-page-img, .reader-page-canvas {
  max-width: 100%; max-height: 100%; object-fit: contain;
  border-radius: 6px; box-shadow: 0 0 40px rgba(0,0,0,0.5), 0 0 0 1px var(--border);
  background: #fff; user-select: none; -webkit-user-drag: none;
}
.reader-spinner {
  position: absolute; font-size: 30px; color: var(--acc); filter: drop-shadow(0 0 10px var(--acc-glow));
  display: none;
}
.reader-spinner.show { display: block; }
.reader-error {
  color: var(--txt3); font-size: 14px; text-align: center; padding: 20px;
}
.reader-nav {
  flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--border2); background: var(--card); color: var(--acc);
  font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
}
.reader-nav:hover:not(:disabled) { border-color: var(--acc); box-shadow: 0 0 14px var(--acc-glow); transform: scale(1.08); }
.reader-nav:disabled { opacity: 0.3; cursor: not-allowed; }

.reader-bottom {
  flex-shrink: 0; display: flex; align-items: center; gap: 16px;
  padding: 12px 20px calc(14px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--glass-border); background: var(--surface);
  backdrop-filter: blur(var(--glass-blur));
}
.reader-bottom input[type=range] {
  flex: 1; accent-color: var(--acc); height: 4px; cursor: pointer;
}
.reader-pageno {
  flex-shrink: 0; display: flex; align-items: center; gap: 4px;
  font-family: var(--font-mono); font-size: 13px; color: var(--txt2); white-space: nowrap;
}
.reader-pageno input {
  width: 52px; padding: 6px 8px; text-align: center; font-family: var(--font-mono);
}

/* True OS-level fullscreen via the Fullscreen API */
.reader-overlay:fullscreen,
.reader-overlay:-webkit-full-screen {
  width: 100vw; height: 100vh; background: #03040c;
}
.reader-overlay:fullscreen .reader-nav,
.reader-overlay:-webkit-full-screen .reader-nav { width: 52px; height: 52px; font-size: 19px; }

@media (max-width: 768px) {
  .reader-title { max-width: 34vw; font-size: 11.5px; }
  .reader-tool { width: 28px; height: 28px; font-size: 14px; }
  .reader-zoom-lvl { display: none; }
  .reader-nav { width: 38px; height: 38px; font-size: 14px; }
  .reader-stage { padding: 6px; gap: 4px; }
}

/* Custom Scrollbars */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: var(--acc); box-shadow: 0 0 8px var(--acc-glow); }

/* --- MOBILE LAYOUT --- */
@media (max-width: 768px) {
  header { padding: 0 16px; }
  .body { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .sidebar { border-right: none; }
  .main { display: none; }

  .book-list {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px; padding: 8px 12px 24px;
  }

  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    z-index: 40; opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
  }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--card); border-top: 1px solid var(--glass-border);
    border-radius: 24px 24px 0 0; max-height: 90dvh; overflow-y: auto;
    padding: 16px 20px calc(24px + env(safe-area-inset-bottom));
    transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1);
    box-shadow: 0 -20px 40px rgba(0,0,0,0.3);
    backdrop-filter: blur(var(--glass-blur)); -webkit-backdrop-filter: blur(var(--glass-blur));
  }
  .sheet.show { transform: translateY(0); }
  .sheet-handle {
    width: 48px; height: 5px; background: var(--border2); border-radius: 99px;
    margin: 0 auto 16px; transition: background 0.3s ease;
  }
  .sheet-close {
    position: absolute; top: 16px; right: 16px;
    background: var(--bg); border: 1px solid var(--border2); color: var(--txt);
    width: 36px; height: 36px; border-radius: 50%; font-size: 20px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    box-shadow: var(--shadow-sm); transition: all 0.3s ease;
  }
  .sheet-close:hover { transform: rotate(90deg) scale(1.1); border-color: var(--acc); }

  .sheet .sel-info, .sheet .opt-card, .sheet .jobs-section { display: none; }
  .sheet .sel-info.show, .sheet .opt-card.show, .sheet .jobs-section.show { display: flex; }
  .sheet .opt-card.show, .sheet .jobs-section.show { display: block; }

  .sel-info { flex-direction: column; text-align: center; align-items: center; }
  .sel-info-cover { width: 120px; height: 172px; }

  .btn-row .btn { flex: 1; min-width: 0; }
}
@media (min-width: 769px) {
  .sheet, .sheet-backdrop { display: none !important; }
}

/* --- REDUCED MOTION --- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .bg-gradient { animation: none; }
  .particle { display: none; }
  .book-item { opacity: 1; animation: none; }
}
</style>
</head>
<body>
<div class="bg-gradient"></div>
<div class="cyber-grid"></div>
<div class="glow-orbs"><span class="orb orb1"></span><span class="orb orb2"></span><span class="orb orb3"></span></div>
<div class="particles" id="particles"></div>
<div class="vignette"></div>
<div class="scanlines"></div>
<div class="app">
  <header>
    <span class="logo">&#128218;</span>
    <h1>YCT Downloader</h1>

    <!-- THEME TOGGLE BUTTON -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">
      <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM3.515 4.929l1.414-1.414L7.05 5.636 5.636 7.05 3.515 4.93zM16.95 18.364l1.414-1.414 2.121 2.121-1.414 1.414-2.121-2.121zm2.121-14.85l1.414 1.415-2.121 2.121-1.414-1.414 2.121-2.121zM5.636 16.95l1.414 1.414-2.121 2.121-1.414-1.414 2.121-2.121zM23 11v2h-3v-2h3zM4 11v2H1v-2h3z"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>

    <span class="badge warn" id="health">checking&#8230;</span>
  </header>
  <div class="body">
    <aside class="sidebar">
      <div class="cat-bar">
        <select id="cat"><option>Loading&#8230;</option></select>
        <button class="btn btn-ghost" id="loadBooks">Load</button>
      </div>
      <div class="books-hd">
        <span>Available Books</span>
        <span class="count" id="bookCount"></span>
      </div>
      <div class="book-list" id="books">
        <div class="muted">Pick a category, then tap Load.</div>
      </div>
    </aside>
    <main class="main" id="mainPane">
      <div id="mainContent">
        <div class="main-empty" id="mainEmpty">
          <div class="icon">&#128218;</div>
          <h3>Select a book to get started</h3>
          <p>Pick a category on the left, choose a book, then queue a download to Telegram or your browser.</p>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Mobile bottom sheet -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <button class="sheet-close" id="sheetClose" aria-label="Close">&times;</button>
  <div id="sheetContent"></div>
</div>

<!-- In-browser ebook reader: image-preview mode (before downloading)
     or PDF mode (re-opening a part that's already built) -->
<div class="reader-overlay" id="readerOverlay">
  <div class="reader-top">
    <div class="reader-title" id="readerTitle">&mdash;</div>
    <div class="reader-toolbar">
      <button class="reader-tool" id="readerZoomOut" aria-label="Zoom out" title="Zoom out">&#8722;</button>
      <span class="reader-zoom-lvl" id="readerZoomLvl">100%</span>
      <button class="reader-tool" id="readerZoomIn" aria-label="Zoom in" title="Zoom in">&#43;</button>
      <button class="reader-tool" id="readerFullscreen" aria-label="Toggle fullscreen" title="Fullscreen">&#9974;</button>
    </div>
    <button class="reader-close" id="readerClose" aria-label="Close reader">&times;</button>
  </div>
  <div class="reader-stage" id="readerStage">
    <button class="reader-nav prev" id="readerPrev" aria-label="Previous page">&#10094;</button>
    <div class="reader-page-wrap" id="readerPageWrap">
      <div class="reader-zoom-wrap" id="readerZoomWrap">
        <img id="readerImg" class="reader-page-img" alt="page" style="display:none;"/>
        <canvas id="readerCanvas" class="reader-page-canvas" style="display:none;"></canvas>
      </div>
      <div class="reader-spinner" id="readerSpinner"><span class="spin">&#8987;</span></div>
      <div class="reader-error" id="readerError" style="display:none;">Couldn't load this page.</div>
    </div>
    <button class="reader-nav next" id="readerNext" aria-label="Next page">&#10095;</button>
  </div>
  <div class="reader-bottom">
    <input type="range" id="readerSlider" min="1" max="1" value="1"/>
    <div class="reader-pageno">
      <input type="number" id="readerPageInput" min="1" value="1"/> / <span id="readerTotal">?</span>
    </div>
  </div>
</div>

<!-- Reusable content templates -->
<template id="tplDetails">
  <div class="sel-info" id="selInfo">
    <div id="selCoverContainer"></div>
    <div class="sel-details">
      <strong id="selTitle">&#8212;</strong>
      <span id="selMeta"></span>
      <button class="btn btn-ghost reader-preview-btn" id="previewBtn" type="button">&#128214; Read Online</button>
    </div>
  </div>
  <div class="opt-card" id="optCard">
    <h2>Download Options</h2>
    <div class="opt-row">
      <label>Start <input type="number" id="start" value="1" min="1"></label>
      <label>End <input type="number" id="end" placeholder="all"></label>
      <label class="chk-label" style="margin-left:auto;"><input type="checkbox" id="ocr"> Searchable PDF (OCR)</label>
    </div>
    <div class="btn-row">
      <button class="btn btn-pri" id="goTelegram">&#9992; Send to Telegram</button>
      <button class="btn btn-dl" id="goBrowser">&#8595; Download to Device</button>
      <button class="btn btn-ok" id="goBoth">&#9889; Do Both</button>
    </div>
  </div>
  <div class="jobs-section" id="jobsSection">
    <h2>Active &amp; Recent Jobs</h2>
    <div id="jobs"></div>
  </div>
</template>

if (window.pdfjsLib) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.js';

<script>
const $ = s => document.querySelector(s);
let selected = null;
const isMobile = () => window.matchMedia('(max-width: 768px)').matches;

/* --- FLOATING PARTICLES --- */
function initParticles() {
  const container = document.getElementById('particles');
  if (!container) return;
  const count = window.matchMedia('(max-width: 768px)').matches ? 12 : 24;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 6 + 2;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (Math.random() * 20 + 15) + 's';
    p.style.animationDelay = Math.random() * 20 + 's';
    container.appendChild(p);
  }
}
initParticles();

/* --- RIPPLE EFFECT ON BUTTONS --- */
document.addEventListener('click', function(e) {
  const btn = e.target.closest('.btn');
  if (!btn || btn.disabled) return;
  const rect = btn.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
});

/* --- MAGNETIC HOVER ON PRIMARY BUTTONS --- */
document.addEventListener('mousemove', function(e) {
  document.querySelectorAll('.btn-pri').forEach(btn => {
    if (btn.disabled) return;
    const rect = btn.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width / 2;
    const y = e.clientY - rect.top - rect.height / 2;
    const dist = Math.sqrt(x * x + y * y);
    if (dist < 80) {
      const strength = (1 - dist / 80) * 0.3;
      btn.style.transform = `translate(${x * strength}px, ${y * strength}px) translateY(-2px)`;
    } else {
      btn.style.transform = '';
    }
  });
});

/* --- 3D TILT ON BOOK CARDS --- */
document.addEventListener('mousemove', function(e) {
  document.querySelectorAll('.book-item').forEach(card => {
    const rect = card.getBoundingClientRect();
    if (e.clientX < rect.left - 50 || e.clientX > rect.right + 50 ||
        e.clientY < rect.top - 50 || e.clientY > rect.bottom + 50) {
      card.style.transform = '';
      return;
    }
    if (e.clientX < rect.left || e.clientX > rect.right ||
        e.clientY < rect.top || e.clientY > rect.bottom) return;
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    card.style.transform = `perspective(600px) rotateY(${x * 8}deg) rotateX(${-y * 8}deg) translateY(-6px) scale(1.02)`;
  });
});

/* --- PARALLAX SCROLL --- */
const mainPane = document.getElementById('mainPane');
if (mainPane) {
  mainPane.addEventListener('scroll', function() {
    const scrollTop = this.scrollTop;
    this.querySelectorAll('.job-card, .sel-info, .opt-card').forEach((el, i) => {
      const offset = (scrollTop * 0.02 * (i + 1)) % 10;
      el.style.setProperty('--parallax', offset + 'px');
    });
  });
}

/* --- THEME TOGGLE LOGIC --- */
const themeToggle = document.getElementById('themeToggle');
const htmlEl = document.documentElement;

const savedTheme = localStorage.getItem('theme');
if (savedTheme) {
  htmlEl.setAttribute('data-theme', savedTheme);
} else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
  htmlEl.setAttribute('data-theme', 'light');
}

themeToggle.addEventListener('click', () => {
  if (htmlEl.getAttribute('data-theme') === 'light') {
    htmlEl.removeAttribute('data-theme');
    localStorage.setItem('theme', 'dark');
  } else {
    htmlEl.setAttribute('data-theme', 'light');
    localStorage.setItem('theme', 'light');
  }
});

// Render template into desktop main pane on load
function renderMain() {
  const tpl = document.getElementById('tplDetails').content.cloneNode(true);
  document.getElementById('mainContent').appendChild(tpl);
  bindActions();
}

function bindActions() {
  $('#goTelegram').onclick = ()=>go({telegram:true,browser:false});
  $('#goBrowser').onclick  = ()=>go({telegram:false,browser:true});
  $('#goBoth').onclick     = ()=>go({telegram:true,browser:true});
  $('#previewBtn').onclick = ()=>openPreviewReader();
}

// On mobile, content lives inside the sheet.
function moveContentToSheet() {
  const sheet = document.getElementById('sheetContent');
  const main = document.getElementById('mainContent');
  while (main.firstChild) sheet.appendChild(main.firstChild);
}
function moveContentToMain() {
  const sheet = document.getElementById('sheetContent');
  const main = document.getElementById('mainContent');
  while (sheet.firstChild) main.appendChild(sheet.firstChild);
}

function openSheet() {
  if (!isMobile()) return;
  moveContentToSheet();
  document.getElementById('sheet').classList.add('show');
  document.getElementById('sheetBackdrop').classList.add('show');
}
function closeSheet() {
  document.getElementById('sheet').classList.remove('show');
  document.getElementById('sheetBackdrop').classList.remove('show');
  setTimeout(moveContentToMain, 300);
}
document.getElementById('sheetClose').onclick = closeSheet;
document.getElementById('sheetBackdrop').onclick = closeSheet;

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.status);
  return r.json();
}

function fmtStatus(s) {
  if (!s) return '';
  return s.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
}
function pillClass(status) {
  if (status === 'done') return 'pill-done';
  if (status === 'error') return 'pill-err';
  if (status === 'queued') return 'pill-queue';
  if ((status||'').startsWith('waiting_user')) return 'pill-wait';
  return 'pill-run';
}

async function health() {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 8000);
    const r = await fetch('/healthz', {signal: ctrl.signal});
    clearTimeout(timer);
    const h = await r.json();
    const el = $('#health');
    if (h.ok) { el.textContent='System Ready'; el.className='badge ok'; }
    else { el.textContent='Env Missing'; el.className='badge warn'; }
  } catch {
    $('#health').textContent='Connecting...';
    setTimeout(health, 4000);
  }
}

async function loadCats() {
  const sel = $('#cat');
  sel.innerHTML = '<option>Loading...</option>';
  for (let attempt = 1; attempt <= 5; attempt++) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(()=>ctrl.abort(), 35000);
      const r = await fetch('/api/categories', {signal: ctrl.signal});
      clearTimeout(timer);
      if (!r.ok) {
        const err = await r.json().catch(()=>({detail:'server error'}));
        throw new Error(err.detail || r.status);
      }
      const cats = await r.json();
      if (!cats.length) { sel.innerHTML='<option>No categories found</option>'; return; }
      sel.innerHTML = cats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
      return;
    } catch(e) {
      if (attempt < 5) {
        sel.innerHTML=`<option>Retrying (${attempt}/5)...</option>`;
        await new Promise(r=>setTimeout(r, 3000));
      } else {
        sel.innerHTML=`<option>Failed: ${e.message}</option>`;
      }
    }
  }
}

/* --- SKELETON LOADER --- */
function showSkeletons() {
  const books = $('#books');
  let html = '';
  for (let i = 0; i < 6; i++) {
    html += `
      <div class="skeleton-card" style="animation: fadeInUp 0.4s ease ${i * 0.08}s both;">
        <div class="skeleton-cover"></div>
        <div class="skeleton-line mid"></div>
        <div class="skeleton-line short"></div>
      </div>`;
  }
  books.innerHTML = html;
}

/* --- COUNT-UP ANIMATION --- */
function countUp(el, target, duration = 800) {
  const start = 0;
  const startTime = performance.now();
  function update(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const value = Math.round(start + (target - start) * eased);
    el.textContent = value + ' books';
    if (progress < 1) requestAnimationFrame(update);
    else el.textContent = target + ' books';
  }
  requestAnimationFrame(update);
}

async function loadBooks() {
  const cat = $('#cat').value;
  const btn = $('#loadBooks');
  btn.disabled = true;
  btn.innerHTML = '<span class="spin">&#8987;</span>';
  showSkeletons();
  $('#bookCount').textContent = '';
  try {
    const books = await api('/api/books?cat='+cat);
    if (!books.length) { $('#books').innerHTML='<div class="muted">No books found.</div>'; return; }
    countUp($('#bookCount'), books.length);
    $('#books').innerHTML = books.map((b, i) => {
      const coverUrl = b.cover || '';
      const coverHtml = coverUrl
        ? `<img src="${coverUrl}" class="book-cover-img" alt="cover" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=\\'book-icon-fallback\\'>📚</div>'"/>`
        : `<div class="book-icon-fallback">📚</div>`;
      return `
      <div class="book-item" data-id="${b.book_id}" data-name="${encodeURIComponent(b.name)}" data-cover="${encodeURIComponent(coverUrl)}" style="animation-delay: ${i * 0.06}s;">
        ${coverHtml}
        <div class="info">
          <div class="name">${b.name}</div>
          <div class="sub">ID: ${b.book_id}</div>
        </div>
      </div>`;
    }).join('');
    document.querySelectorAll('.book-item').forEach(el=>el.onclick=()=>selectBook(el));
  } catch(e) {
    $('#books').innerHTML=`<div class="muted">Error: ${e.message}</div>`;
  } finally {
    btn.disabled=false; btn.textContent='Load';
  }
}

async function selectBook(el) {
  document.querySelectorAll('.book-item').forEach(x=>x.classList.remove('sel'));
  el.classList.add('sel');

  const coverUrl = decodeURIComponent(el.dataset.cover);
  selected = {
    book_id: +el.dataset.id,
    title: decodeURIComponent(el.dataset.name),
    cover: coverUrl,
    total: null
  };

  const mainEmpty = document.getElementById('mainEmpty');
  if (mainEmpty) mainEmpty.remove();

  $('#selInfo').classList.add('show');
  $('#selTitle').textContent = selected.title;
  $('#optCard').classList.add('show');

  const selCoverHtml = coverUrl
    ? `<img src="${coverUrl}" class="sel-info-cover" alt="cover" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=\\'sel-info-fallback\\'>📚</div>'"/>`
    : `<div class="sel-info-fallback">📚</div>`;
  $('#selCoverContainer').innerHTML = selCoverHtml;
  $('#selMeta').innerHTML = `<span class="spin" style="font-size:12px; margin-right:6px;">&#8987;</span> Checking pages&hellip;`;
  $('#previewBtn').disabled = true;

  openSheet();

  try {
    const p = await api('/api/pages?book_id='+selected.book_id);
    selected.total = p.total_pages;
    $('#selMeta').innerHTML = `&#128196; ${p.total_pages||'Unknown'} pages &nbsp;&middot;&nbsp; ID ${selected.book_id}`;
    if (p.total_pages) $('#end').placeholder=`all (${p.total_pages})`;
    $('#previewBtn').disabled = !p.total_pages;
  } catch {
    $('#selMeta').innerHTML = `ID ${selected.book_id}`;
    $('#previewBtn').disabled = true;
  }
}

async function go({telegram, browser}) {
  if (!selected) { alert('Select a book first.'); return; }
  const body = {
    book_id:selected.book_id, title:selected.title, cover:selected.cover,
    start:+$('#start').value||1,
    end:$('#end').value?(+$('#end').value):null,
    do_ocr:$('#ocr').checked,
    total_pages:selected.total||null,
    browser_download:browser,
    telegram:telegram,
  };
  try {
    await api('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    pollJobs();
  } catch(e) { alert('Failed to queue: '+e.message); }
}

function jobCard(jb) {
  const pct = jb.total ? Math.round(jb.done*100/jb.total) : 0;
  const isDone = jb.status==='done';
  const isErr  = jb.status==='error';
  const isWait = (jb.status||'').startsWith('waiting_user');
  const barCls = isDone?'done':isErr?'err':'';
  const pillCls= pillClass(jb.status);
  const ts = new Date(jb.ts*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const errMsg = isErr?`<div class="err-msg">&#9888; Failed: ${jb.error||'Unknown error'}</div>`:'';
  const totalParts = jb.total_parts||0;
  const partsDone  = jb.parts_done||0;
  const partsSummary = totalParts>1
    ?`<div class="parts-summary">&#128194; ${partsDone}/${totalParts} parts confirmed</div>`:'';

  let dlBlock='';
  const cp = jb.current_part;
  if (cp && !cp.consumed && jb.browser_download) {
    const lbl = totalParts>1
      ?`Part ${cp.part_num} of ${cp.total_parts} &mdash; pages ${cp.pages}`
      :'Your PDF is ready';
    const nxtLbl = cp.part_num < cp.total_parts ? 'Done &mdash; next part' : 'Done &mdash; finish';
    dlBlock=`
<div class="gate-box">
  <div class="gate-label">&#128196; <b>${lbl}</b></div>
  <div class="gate-hint">Save the file to your device, then tap <b>Done</b>.</div>
  <div class="gate-btns">
    <a href="/api/jobs/${jb.id}/download" download="${cp.name}" class="btn btn-dl">&#8595; Download${totalParts>1?' Part '+cp.part_num:''}</a>
    <button class="btn btn-ghost" onclick="openPdfReader('${jb.id}','${(cp.name||jb.title||'').replace(/'/g,"\\'")}')">&#128214; Read</button>
    <button class="btn btn-ok" onclick="confirmPart('${jb.id}')">&#10003; ${nxtLbl}</button>
  </div>
</div>`;
  } else if (cp && cp.consumed && jb.browser_download && !isDone) {
    dlBlock=`<div class="gate-waiting"><span class="spin">&#8987;</span> Building part ${(cp.part_num||0)+1}&hellip;</div>`;
  }

  const statusLabel = isDone ? 'Done' : isErr ? 'Error' : isWait ? 'Waiting' : fmtStatus(jb.status);

  return `
<div class="job-card" id="job-${jb.id}">
  <div class="title-row">
    <div class="book-title">${jb.title}</div>
    <span class="status-pill ${pillCls}">${statusLabel}</span>
    <button class="job-cancel" title="Cancel &amp; delete this job" onclick="cancelJob('${jb.id}')">&times;</button>
  </div>
  <div class="prog-row">
    <div class="bar ${barCls}"><i style="width:${pct}%"></i></div>
    <div class="prog-txt">${jb.done}/${jb.total||'?'} pages</div>
  </div>
  <div class="meta"><span>ID: ${jb.book_id}</span> <span>&bull;</span> <span>${ts}</span></div>
  ${partsSummary}${errMsg}${dlBlock}
</div>`;
}

async function confirmPart(jid) {
  try {
    await fetch(`/api/jobs/${jid}/confirm`,{method:'POST'});
    pollJobs();
  } catch(e) { alert('Error: '+e.message); }
}

async function cancelJob(jid) {
  if (!confirm('Cancel this job and delete any pages already downloaded for it?')) return;
  const card = document.getElementById('job-'+jid);
  if (card) {
    card.style.transition = 'all 0.35s cubic-bezier(0.4,0,0.2,1)';
    card.style.pointerEvents = 'none';
    card.style.opacity = '0';
    card.style.transform = 'translateX(30px) scale(0.97)';
    card.style.maxHeight = card.offsetHeight + 'px';
    requestAnimationFrame(() => {
      card.style.maxHeight = '0px';
      card.style.marginBottom = '0px';
      card.style.paddingTop = '0px';
      card.style.paddingBottom = '0px';
      card.style.overflow = 'hidden';
    });
  }
  try {
    await fetch(`/api/jobs/${jid}`, { method: 'DELETE' });
  } catch (e) {
    // even if the request fails, refresh — server state is the source of truth
  }
  setTimeout(pollJobs, 380);
}

async function pollJobs() {
  try {
    const js = await api('/api/jobs');
    const section = $('#jobsSection');
    const el = $('#jobs');
    if (!js.length) {
      section.classList.remove('show');
      el.innerHTML = '';
    } else {
      section.classList.add('show');
      el.innerHTML = js.map(jobCard).join('');
      const mainEmpty = document.getElementById('mainEmpty');
      if (mainEmpty) mainEmpty.remove();
    }
  } catch {}
}

// ===================== EBOOK READER =====================
// Two modes:
//  'img' — read a book online before downloading. Streams ONE page image at
//          a time from /api/books/{id}/page/{n}; nothing is saved to disk
//          and the server only ever caches a handful of pages in RAM.
//  'pdf' — reopen a part that's already been built for this job. Uses
//          pdf.js, which lazily fetches/renders one page at a time via
//          range requests instead of loading the whole file into memory.
const reader = {
  mode: null, bookId: null, jobId: null, total: 1, page: 1,
  pdfDoc: null, pdfTask: null, rendering: false,
};

// Zoom/pan state — independent of which page is showing. Pinch-zooming or
// panning NEVER changes reader.page; only the nav buttons/slider/swipe do.
const zoom = {
  scale: 1, x: 0, y: 0,
  minScale: 1, maxScale: 4,
  pinching: false, panning: false,
  startDist: 0, startScale: 1,
  startX: 0, startY: 0, startPanX: 0, startPanY: 0,
  lastTapTime: 0,
};

function _readerEls() {
  return {
    overlay: document.getElementById('readerOverlay'),
    title: document.getElementById('readerTitle'),
    img: document.getElementById('readerImg'),
    canvas: document.getElementById('readerCanvas'),
    spinner: document.getElementById('readerSpinner'),
    error: document.getElementById('readerError'),
    slider: document.getElementById('readerSlider'),
    pageInput: document.getElementById('readerPageInput'),
    total: document.getElementById('readerTotal'),
    prev: document.getElementById('readerPrev'),
    next: document.getElementById('readerNext'),
    wrap: document.getElementById('readerPageWrap'),
    zoomWrap: document.getElementById('readerZoomWrap'),
    zoomLvl: document.getElementById('readerZoomLvl'),
  };
}

function _applyZoom(snap) {
  const els = _readerEls();
  els.zoomWrap.classList.toggle('snap', !!snap);
  els.zoomWrap.style.transform = `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.scale})`;
  els.zoomLvl.textContent = Math.round(zoom.scale * 100) + '%';
  els.wrap.style.cursor = zoom.scale > 1 ? 'grab' : '';
}

function _resetZoom(snap) {
  zoom.scale = 1; zoom.x = 0; zoom.y = 0;
  _applyZoom(snap);
}

function _clampPan() {
  // keep the page from being dragged entirely off-screen
  const els = _readerEls();
  const maxX = (els.wrap.clientWidth * (zoom.scale - 1)) / 2 + 40;
  const maxY = (els.wrap.clientHeight * (zoom.scale - 1)) / 2 + 40;
  zoom.x = Math.max(-maxX, Math.min(maxX, zoom.x));
  zoom.y = Math.max(-maxY, Math.min(maxY, zoom.y));
}

function readerZoomBy(delta) {
  zoom.scale = Math.max(zoom.minScale, Math.min(zoom.maxScale, +(zoom.scale + delta).toFixed(2)));
  if (zoom.scale === 1) { zoom.x = 0; zoom.y = 0; }
  _clampPan();
  _applyZoom(true);
}

function openPreviewReader() {
  if (!selected || !selected.book_id) return;
  const els = _readerEls();
  reader.mode = 'img';
  reader.bookId = selected.book_id;
  reader.jobId = null;
  reader.total = selected.total || 9999;
  reader.page = 1;
  els.title.textContent = '📖 ' + (selected.title || 'Read Online');
  els.slider.max = String(reader.total);
  els.total.textContent = selected.total ? String(selected.total) : '?';
  els.canvas.style.display = 'none';
  els.error.style.display = 'none';
  _resetZoom(false);
  els.overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
  readerShowPage(1);
}

async function openPdfReader(jid, title) {
  const els = _readerEls();
  reader.mode = 'pdf';
  reader.jobId = jid;
  reader.bookId = null;
  reader.page = 1;
  reader.pdfDoc = null;
  els.title.textContent = '📖 ' + (title || 'Reading');
  els.img.style.display = 'none';
  els.error.style.display = 'none';
  _resetZoom(false);
  els.overlay.classList.add('show');
  document.body.style.overflow = 'hidden';
  _readerSpin(true);
  try {
    if (!window.pdfjsLib) throw new Error('PDF engine failed to load — check your connection');
    reader.pdfTask = pdfjsLib.getDocument({ url: `/api/jobs/${jid}/read`, withCredentials: true });
    reader.pdfDoc = await reader.pdfTask.promise;
    reader.total = reader.pdfDoc.numPages;
    els.slider.max = String(reader.total);
    els.total.textContent = String(reader.total);
    readerShowPage(1);
  } catch (e) {
    _readerSpin(false);
    els.error.style.display = 'block';
    els.error.textContent = 'Could not open file: ' + e.message;
  }
}

function _readerSpin(on) {
  document.getElementById('readerSpinner').classList.toggle('show', !!on);
}

function readerShowPage(n) {
  const els = _readerEls();
  n = Math.max(1, Math.min(reader.total || 9999, n));
  reader.page = n;
  els.slider.value = String(n);
  els.pageInput.value = String(n);
  els.prev.disabled = n <= 1;
  els.next.disabled = !!reader.total && n >= reader.total;
  els.error.style.display = 'none';
  _resetZoom(false);

  if (reader.mode === 'img') {
    _readerSpin(true);
    els.canvas.style.display = 'none';
    const img = els.img;
    img.onload = () => { _readerSpin(false); img.style.display = 'block'; };
    img.onerror = () => { _readerSpin(false); img.style.display='none'; els.error.style.display='block'; els.error.textContent='Page unavailable.'; };
    img.src = `/api/books/${reader.bookId}/page/${n}`;
    // warm the next page in the browser's own HTTP cache — single small
    // image, no extra app-side memory held
    if (n + 1 <= reader.total) { const pre = new Image(); pre.src = `/api/books/${reader.bookId}/page/${n+1}`; }
  } else if (reader.mode === 'pdf' && reader.pdfDoc) {
    renderPdfPage(n);
  }
}

async function renderPdfPage(n) {
  if (reader.rendering) return;
  reader.rendering = true;
  _readerSpin(true);
  const els = _readerEls();
  try {
    const page = await reader.pdfDoc.getPage(n);
    const canvas = els.canvas;
    const ctx = canvas.getContext('2d');
    const wrap = els.wrap;
    const vp0 = page.getViewport({ scale: 1 });
    const scale = Math.min(2.2, (wrap.clientWidth - 16) / vp0.width, (wrap.clientHeight - 16) / vp0.height);
    const viewport = page.getViewport({ scale: Math.max(0.3, scale) });
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: ctx, viewport }).promise;
    els.img.style.display = 'none';
    canvas.style.display = 'block';
  } catch (e) {
    els.error.style.display = 'block';
    els.error.textContent = 'Could not render this page.';
  } finally {
    _readerSpin(false);
    reader.rendering = false;
  }
}

async function _toggleFullscreen() {
  const els = _readerEls();
  const isFs = document.fullscreenElement || document.webkitFullscreenElement;
  try {
    if (!isFs) {
      if (els.overlay.requestFullscreen) await els.overlay.requestFullscreen();
      else if (els.overlay.webkitRequestFullscreen) els.overlay.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  } catch {}
}
document.addEventListener('fullscreenchange', () => {
  document.getElementById('readerFullscreen').classList.toggle('active',
    !!(document.fullscreenElement === document.getElementById('readerOverlay')));
});

function closeReader() {
  const els = _readerEls();
  els.overlay.classList.remove('show');
  document.body.style.overflow = '';
  if (document.fullscreenElement === els.overlay) {
    try { document.exitFullscreen(); } catch {}
  }
  // free everything immediately — don't wait for GC
  els.img.src = '';
  if (reader.pdfDoc) { try { reader.pdfDoc.destroy(); } catch {} }
  reader.pdfDoc = null; reader.mode = null; reader.bookId = null; reader.jobId = null;
  _resetZoom(false);
}

document.getElementById('readerClose').onclick = closeReader;
document.getElementById('readerPrev').onclick = () => readerShowPage(reader.page - 1);
document.getElementById('readerNext').onclick = () => readerShowPage(reader.page + 1);
document.getElementById('readerSlider').oninput = (e) => readerShowPage(+e.target.value);
document.getElementById('readerPageInput').onchange = (e) => readerShowPage(+e.target.value);
document.getElementById('readerZoomIn').onclick = () => readerZoomBy(0.4);
document.getElementById('readerZoomOut').onclick = () => readerZoomBy(-0.4);
document.getElementById('readerFullscreen').onclick = _toggleFullscreen;
document.addEventListener('keydown', (e) => {
  if (!document.getElementById('readerOverlay').classList.contains('show')) return;
  if (e.key === 'Escape') closeReader();
  else if (e.key === 'ArrowLeft' && zoom.scale === 1) readerShowPage(reader.page - 1);
  else if (e.key === 'ArrowRight' && zoom.scale === 1) readerShowPage(reader.page + 1);
  else if (e.key === '+' || e.key === '=') readerZoomBy(0.4);
  else if (e.key === '-') readerZoomBy(-0.4);
});

// ---- Touch: pinch-to-zoom, pan-when-zoomed, swipe-to-turn-page-when-not ----
(function() {
  const wrap = document.getElementById('readerPageWrap');
  let swipeStartX = null, swipeStartY = null, moved = false;

  function dist(t0, t1) {
    return Math.hypot(t1.clientX - t0.clientX, t1.clientY - t0.clientY);
  }

  wrap.addEventListener('touchstart', (e) => {
    moved = false;
    if (e.touches.length === 2) {
      zoom.pinching = true; zoom.panning = false;
      zoom.startDist = dist(e.touches[0], e.touches[1]);
      zoom.startScale = zoom.scale;
      swipeStartX = null;
    } else if (e.touches.length === 1) {
      if (zoom.scale > 1) {
        zoom.panning = true;
        zoom.startX = e.touches[0].clientX; zoom.startY = e.touches[0].clientY;
        zoom.startPanX = zoom.x; zoom.startPanY = zoom.y;
      } else {
        swipeStartX = e.touches[0].clientX;
        swipeStartY = e.touches[0].clientY;
      }
    }
  }, { passive: true });

  wrap.addEventListener('touchmove', (e) => {
    moved = true;
    if (zoom.pinching && e.touches.length === 2) {
      const d = dist(e.touches[0], e.touches[1]);
      zoom.scale = Math.max(zoom.minScale, Math.min(zoom.maxScale, zoom.startScale * (d / zoom.startDist)));
      _clampPan();
      _applyZoom(false);
    } else if (zoom.panning && e.touches.length === 1) {
      zoom.x = zoom.startPanX + (e.touches[0].clientX - zoom.startX);
      zoom.y = zoom.startPanY + (e.touches[0].clientY - zoom.startY);
      _clampPan();
      _applyZoom(false);
    }
  }, { passive: true });

  wrap.addEventListener('touchend', (e) => {
    if (zoom.pinching) {
      zoom.pinching = false;
      if (zoom.scale < 1.05) _resetZoom(true);
      else _applyZoom(true);
      return;
    }
    if (zoom.panning) { zoom.panning = false; return; }
    // Not zoomed and not pinching — check for swipe (page turn) or double-tap (zoom)
    if (swipeStartX !== null && zoom.scale === 1) {
      const t = e.changedTouches[0];
      const dx = t.clientX - swipeStartX, dy = t.clientY - swipeStartY;
      if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        readerShowPage(reader.page + (dx < 0 ? 1 : -1));
      } else if (!moved) {
        const now = Date.now();
        if (now - zoom.lastTapTime < 320) {
          // double-tap: zoom in centered roughly where tapped
          zoom.scale = 2.2; _clampPan(); _applyZoom(true);
        }
        zoom.lastTapTime = now;
      }
    }
    swipeStartX = null;
  }, { passive: true });

  // Desktop: Ctrl/Cmd + wheel to zoom, drag-to-pan when zoomed
  wrap.addEventListener('wheel', (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    readerZoomBy(e.deltaY < 0 ? 0.25 : -0.25);
  }, { passive: false });

  let dragging = false, dragStartX = 0, dragStartY = 0, dragPanX = 0, dragPanY = 0;
  wrap.addEventListener('mousedown', (e) => {
    if (zoom.scale <= 1) return;
    dragging = true;
    dragStartX = e.clientX; dragStartY = e.clientY;
    dragPanX = zoom.x; dragPanY = zoom.y;
    wrap.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    zoom.x = dragPanX + (e.clientX - dragStartX);
    zoom.y = dragPanY + (e.clientY - dragStartY);
    _clampPan();
    _applyZoom(false);
  });
  window.addEventListener('mouseup', () => { dragging = false; if (zoom.scale > 1) wrap.style.cursor = 'grab'; });
  wrap.addEventListener('dblclick', () => {
    if (zoom.scale > 1) _resetZoom(true);
    else { zoom.scale = 2.2; _clampPan(); _applyZoom(true); }
  });
})();

renderMain();
health();
loadCats();
pollJobs();
setInterval(pollJobs, 3000);
$('#loadBooks').onclick = loadBooks;
</script>
