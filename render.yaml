services:
  - type: web
    name: yct-downloader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: YCT_EMAIL
        sync: false
      - key: YCT_PASSWORD
        sync: false
      - key: TG_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
      - key: TG_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false        # set to your https://<service>.onrender.com after first deploy
      - key: OCR_LANG
        value: hin+eng
      - key: MAX_WORKERS
        value: "6"
