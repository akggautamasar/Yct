services:
  - type: web
    name: yct-downloader
    runtime: python
    plan: free
    # Install tesseract + Hindi/English language packs, then Python deps.
    buildCommand: |
      apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-hin tesseract-ocr-eng || true
      pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: YCT_EMAIL
        sync: false
      - key: YCT_PASSWORD
        sync: false
      - key: TG_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
      - key: TG_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false        # set to your https://<service>.onrender.com after first deploy
      - key: OCR_LANG
        value: hin+eng
      - key: MAX_WORKERS
        value: "6"
